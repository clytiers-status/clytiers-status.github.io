<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minecraft サーバーステータス</title>
  <style>
    :root {
      --bg: #f4f6f9;
      --surface: #ffffff;
      --surface-2: #eef1f6;
      --text: #18202c;
      --muted: #5e6b7d;
      --border: #d8e0ea;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --accent-soft: rgba(37, 99, 235, 0.12);
      --ok: #15803d;
      --ok-bg: rgba(21, 128, 61, 0.12);
      --warn: #b45309;
      --warn-bg: rgba(180, 83, 9, 0.12);
      --err: #b91c1c;
      --err-bg: rgba(185, 28, 28, 0.12);
      --shadow: 0 2px 10px rgba(15, 23, 42, 0.06);
      --radius: 10px;
    }

    html[data-theme="dark"] {
      --bg: #0f131a;
      --surface: #171d27;
      --surface-2: #1f2734;
      --text: #e6edf7;
      --muted: #93a2b8;
      --border: #2a3446;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --accent-soft: rgba(59, 130, 246, 0.16);
      --ok: #4ade80;
      --ok-bg: rgba(74, 222, 128, 0.14);
      --warn: #fbbf24;
      --warn-bg: rgba(251, 191, 36, 0.14);
      --err: #f87171;
      --err-bg: rgba(248, 113, 113, 0.14);
      --shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 16px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    button, input {
      font-family: inherit;
      font-size: 14px;
    }

    button {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background-color 0.15s ease, border-color 0.15s ease, opacity 0.15s ease;
    }

    button:hover:not(:disabled) {
      border-color: var(--accent);
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
      font-weight: 600;
    }

    button.primary:hover:not(:disabled) {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
    }

    button.danger {
      color: var(--err);
      border-color: transparent;
      background: transparent;
      padding: 5px 8px;
    }

    button.danger:hover:not(:disabled) {
      background: var(--err-bg);
      border-color: var(--err);
    }

    input[type="text"], input[type="search"] {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 11px;
      outline: none;
    }

    input[type="text"]:focus, input[type="search"]:focus {
      border-color: var(--accent);
    }

    .container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 18px 20px 40px;
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 18px;
      align-items: start;
    }

    @media (max-width: 900px) {
      .container {
        grid-template-columns: 1fr;
      }
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 16px;
    }

    .add-form {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 14px;
    }

    .add-form-row {
      display: flex;
      gap: 8px;
    }

    .add-form-row input {
      flex: 1;
      min-width: 0;
    }

    .server-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .server-item {
      border: 1px solid var(--border);
      background: var(--bg);
      border-radius: 8px;
      padding: 10px 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      transition: border-color 0.15s ease, background-color 0.15s ease;
    }

    .server-item:hover {
      border-color: var(--accent);
    }

    .server-item.active {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .server-item-main {
      min-width: 0;
      flex: 1;
    }

    .server-item-title {
      font-weight: 700;
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .server-item-addr {
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    .server-item-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 5px;
      flex-wrap: wrap;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 999px;
      border: 1px solid transparent;
    }

    .badge.fetching {
      color: var(--warn);
      background: var(--warn-bg);
    }

    .badge.online {
      color: var(--ok);
      background: var(--ok-bg);
    }

    .badge.offline {
      color: var(--err);
      background: var(--err-bg);
    }

    .badge.edition {
      color: var(--accent);
      background: var(--accent-soft);
    }

    .detail-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }

    .detail-title-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .server-icon {
      width: 56px;
      height: 56px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      object-fit: cover;
      image-rendering: pixelated;
      flex-shrink: 0;
    }

    .detail-title {
      margin: 0;
      font-size: 20px;
      word-break: break-all;
    }

    .detail-sub {
      font-size: 13px;
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 12px;
      margin: 16px 0;
    }

    .stat-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
    }

    .stat-label {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .stat-value {
      font-size: 16px;
      font-weight: 700;
      word-break: break-word;
    }

    .stat-note {
      font-size: 11px;
      color: var(--muted);
      margin-top: 3px;
    }

    .motd-box {
      background: #141418;
      color: #f3f4f6;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 13px;
      white-space: pre-wrap;
      word-break: break-word;
      margin-bottom: 18px;
    }

    .players-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .players-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 8px;
      margin-bottom: 14px;
    }

    .player-card {
      display: flex;
      align-items: center;
      gap: 9px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 10px;
      min-width: 0;
    }

    .player-head {
      width: 24px;
      height: 24px;
      border-radius: 4px;
      image-rendering: pixelated;
      flex-shrink: 0;
      background: var(--surface-2);
    }

    .player-name {
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .pagination {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .pagination button.active-page {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
      font-weight: 700;
    }

    .empty-state {
      text-align: center;
      color: var(--muted);
      padding: 36px 16px;
      border: 1px dashed var(--border);
      border-radius: 8px;
    }

    .help-text {
      font-size: 12px;
      color: var(--muted);
      margin-top: 6px;
    }

    .cookie-preview {
      margin-top: 10px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      white-space: pre-wrap;
      word-break: break-all;
      display: none;
    }

    .cookie-preview.open {
      display: block;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <span>Minecraft サーバーステータス</span>
    </div>
    <div class="header-actions">
      <button type="button" id="refresh-all-btn">すべて更新</button>
      <button type="button" id="inspect-cookie-btn">Cookie確認</button>
      <button type="button" id="theme-toggle-btn" aria-label="テーマ切替">🌙 ダーク</button>
    </div>
  </header>

  <main class="container">
    <aside class="panel">
      <form class="add-form" id="add-server-form">
        <input
          type="text"
          id="server-address-input"
          placeholder="サーバーアドレス (例: hypixel.net / play.example.com:25565)"
          autocomplete="off"
          required
        />
        <div class="add-form-row">
          <input
            type="text"
            id="server-label-input"
            placeholder="表示名 (省略可)"
            autocomplete="off"
          />
          <button type="submit" class="primary" id="add-server-btn">追加</button>
        </div>
      </form>

      <div class="help-text">
        追加すると自動で Java版 / 統合版 (BE) を判定し、Cookieにはアドレス情報のみ保存します。
      </div>

      <div id="cookie-preview" class="cookie-preview"></div>

      <div id="server-list" class="server-list" style="margin-top: 14px;"></div>
    </aside>

    <section class="panel" id="detail-panel">
      <div class="empty-state">
        サーバーを追加するか、左の一覧からサーバーを選択してください。
      </div>
    </section>
  </main>

  <script>
    (function () {
      "use strict";

      const COOKIE_KEY = "mc_srv_list_v1";
      const THEME_STORAGE_KEY = "mc_srv_theme_v1";
      const PAGE_SIZE = 50;
      const AUTO_REFRESH_MS = 20000;
      const REQUEST_TIMEOUT_MS = 8000;

      const DEFAULT_ICON_DATA_URI =
        "data:image/svg+xml;utf8," +
        encodeURIComponent(
          '<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">' +
            '<rect width="64" height="64" rx="8" fill="#2d3748"/>' +
            '<rect x="14" y="14" width="36" height="36" fill="#4a5568"/>' +
            '<rect x="22" y="24" width="6" height="6" fill="#e2e8f0"/>' +
            '<rect x="36" y="24" width="6" height="6" fill="#e2e8f0"/>' +
            '<rect x="24" y="38" width="16" height="5" fill="#cbd5e0"/>' +
          "</svg>"
        );

      const DEFAULT_HEAD_DATA_URI =
        "data:image/svg+xml;utf8," +
        encodeURIComponent(
          '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 8 8" shape-rendering="crispEdges">' +
            '<rect width="8" height="8" fill="#8b6f5c"/>' +
            '<rect x="1" y="1" width="6" height="6" fill="#d8a279"/>' +
            '<rect x="2" y="3" width="1" height="1" fill="#ffffff"/>' +
            '<rect x="5" y="3" width="1" height="1" fill="#ffffff"/>' +
            '<rect x="2" y="5" width="4" height="1" fill="#8d4e38"/>' +
          "</svg>"
        );

      // Cookieにはアドレス情報（id, address, label）のみ保存する
      let savedServers = loadAddressesFromCookie();
      let selectedServerId = savedServers.length > 0 ? savedServers[0].id : null;

      const runtimeState = new Map();
      let playerSearchQuery = "";
      let currentPage = 1;
      let activeFetchGeneration = 0;

      const elForm = document.getElementById("add-server-form");
      const elAddrInput = document.getElementById("server-address-input");
      const elLabelInput = document.getElementById("server-label-input");
      const elServerList = document.getElementById("server-list");
      const elDetailPanel = document.getElementById("detail-panel");
      const elRefreshAllBtn = document.getElementById("refresh-all-btn");
      const elInspectCookieBtn = document.getElementById("inspect-cookie-btn");
      const elCookiePreview = document.getElementById("cookie-preview");
      const elThemeToggleBtn = document.getElementById("theme-toggle-btn");

      initTheme();
      renderServerList();
      renderDetailEmptyOrSelected();

      if (savedServers.length > 0) {
        refreshAllServers();
      }

      setInterval(() => {
        if (savedServers.length > 0) {
          refreshAllServers();
        }
      }, AUTO_REFRESH_MS);

      function initTheme() {
        let theme = null;
        try {
          theme = localStorage.getItem(THEME_STORAGE_KEY);
        } catch (_) {}
        if (!theme) {
          theme =
            window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        }
        applyTheme(theme);
      }

      function applyTheme(theme) {
        const normalized = theme === "dark" ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", normalized);
        elThemeToggleBtn.textContent = normalized === "dark" ? "☀️ ライト" : "🌙 ダーク";
        try {
          localStorage.setItem(THEME_STORAGE_KEY, normalized);
        } catch (_) {}
      }

      elThemeToggleBtn.addEventListener("click", () => {
        const current = document.documentElement.getAttribute("data-theme");
        applyTheme(current === "dark" ? "light" : "dark");
      });

      function loadAddressesFromCookie() {
        try {
          const cookies = document.cookie ? document.cookie.split("; ") : [];
          const target = cookies.find((row) => row.startsWith(COOKIE_KEY + "="));
          if (!target) return [];
          const rawValue = decodeURIComponent(target.slice(COOKIE_KEY.length + 1));
          const parsed = JSON.parse(rawValue);
          if (!Array.isArray(parsed)) return [];
          return parsed
            .filter((item) => item && typeof item.address === "string" && item.address.trim() !== "")
            .map((item, idx) => ({
              id: typeof item.id === "string" && item.id ? item.id : "srv_" + idx + "_" + Date.now(),
              address: item.address.trim(),
              label: typeof item.label === "string" ? item.label.trim() : ""
            }));
        } catch (_) {
          return [];
        }
      }

      function saveAddressesToCookie(list) {
        const minimalList = list.map((item) => ({
          id: String(item.id),
          address: String(item.address).trim(),
          label: String(item.label || "").trim()
        }));
        const encoded = encodeURIComponent(JSON.stringify(minimalList));
        const maxAge = 60 * 60 * 24 * 365;
        document.cookie = `${COOKIE_KEY}=${encoded}; max-age=${maxAge}; path=/; SameSite=Lax`;
        if (elCookiePreview.classList.contains("open")) {
          elCookiePreview.textContent = JSON.stringify(minimalList, null, 2);
        }
      }

      elInspectCookieBtn.addEventListener("click", () => {
        elCookiePreview.classList.toggle("open");
        if (elCookiePreview.classList.contains("open")) {
          const minimalList = savedServers.map((s) => ({
            id: s.id,
            address: s.address,
            label: s.label
          }));
          elCookiePreview.textContent = JSON.stringify(minimalList, null, 2);
        }
      });

      elForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const rawAddr = elAddrInput.value.trim();
        const rawLabel = elLabelInput.value.trim();
        if (!rawAddr) return;

        const existing = savedServers.find(
          (s) => s.address.toLowerCase() === rawAddr.toLowerCase()
        );

        let targetServer;
        if (existing) {
          if (rawLabel) existing.label = rawLabel;
          targetServer = existing;
        } else {
          targetServer = {
            id: "srv_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 7),
            address: rawAddr,
            label: rawLabel
          };
          savedServers.push(targetServer);
        }

        saveAddressesToCookie(savedServers);
        selectedServerId = targetServer.id;
        currentPage = 1;
        playerSearchQuery = "";

        elAddrInput.value = "";
        elLabelInput.value = "";

        renderServerList();
        renderDetailEmptyOrSelected();
        await probeAndFetchServer(targetServer);
      });

      elRefreshAllBtn.addEventListener("click", () => {
        refreshAllServers();
      });

      async function refreshAllServers() {
        if (savedServers.length === 0) return;
        elRefreshAllBtn.disabled = true;
        try {
          await Promise.all(savedServers.map((srv) => probeAndFetchServer(srv)));
        } finally {
          elRefreshAllBtn.disabled = false;
        }
      }

      async function fetchWithTimeout(url, timeoutMs = REQUEST_TIMEOUT_MS) {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), timeoutMs);
        try {
          const res = await fetch(url, {
            signal: controller.signal,
            cache: "no-store",
            headers: { Accept: "application/json" }
          });
          if (!res.ok) {
            throw new Error(`HTTP ${res.status}`);
          }
          return await res.json();
        } finally {
          clearTimeout(timer);
        }
      }

      function normalizePlayers(rawPlayersList) {
        if (!Array.isArray(rawPlayersList)) return [];
        const names = [];
        const seen = new Set();
        for (const entry of rawPlayersList) {
          let name = "";
          if (typeof entry === "string") {
            name = entry.trim();
          } else if (entry && typeof entry === "object") {
            name = String(entry.name_clean || entry.name || entry.username || "").trim();
          }
          if (!name) continue;
          const key = name.toLowerCase();
          if (!seen.has(key)) {
            seen.add(key);
            names.push(name);
          }
        }
        return names;
      }

      function extractMotdText(motdObj) {
        if (!motdObj) return "";
        if (typeof motdObj === "string") {
          return motdObj.replace(/§[0-9a-fk-or]/gi, "");
        }
        if (Array.isArray(motdObj.clean) && motdObj.clean.length > 0) {
          return motdObj.clean.join("\n");
        }
        if (typeof motdObj.raw === "string") {
          return motdObj.raw.replace(/§[0-9a-fk-or]/gi, "");
        }
        if (Array.isArray(motdObj.raw) && motdObj.raw.length > 0) {
          return motdObj.raw.join("\n").replace(/§[0-9a-fk-or]/gi, "");
        }
        return "";
      }

      function parseMcStatusIoJava(data, address) {
        if (!data || data.online !== true) return null;
        const playersList =
          data.players && Array.isArray(data.players.list) ? data.players.list : [];
        return {
          edition: "JE",
          online: true,
          address,
          playersOnline: Number(data.players && data.players.online) || 0,
          playersMax: Number(data.players && data.players.max) || 0,
          players: normalizePlayers(playersList),
          version: (data.version && (data.version.name_clean || data.version.name)) || "不明",
          motd: extractMotdText(data.motd),
          icon: typeof data.icon === "string" && data.icon.startsWith("data:image") ? data.icon : null,
          tps: null
        };
      }

      function parseMcSrvStatJava(data, address) {
        if (!data || data.online !== true) return null;
        const playersList =
          data.players && Array.isArray(data.players.list) ? data.players.list : [];
        return {
          edition: "JE",
          online: true,
          address,
          playersOnline: Number(data.players && data.players.online) || 0,
          playersMax: Number(data.players && data.players.max) || 0,
          players: normalizePlayers(playersList),
          version: data.version || data.protocol?.name || "不明",
          motd: extractMotdText(data.motd),
          icon: typeof data.icon === "string" && data.icon.startsWith("data:image") ? data.icon : null,
          tps: null
        };
      }

      function parseMcStatusIoBedrock(data, address) {
        if (!data || data.online !== true) return null;
        const playersList =
          data.players && Array.isArray(data.players.list) ? data.players.list : [];
        return {
          edition: "BE",
          online: true,
          address,
          playersOnline: Number(data.players && data.players.online) || 0,
          playersMax: Number(data.players && data.players.max) || 0,
          players: normalizePlayers(playersList),
          version: (data.version && (data.version.name_clean || data.version.name)) || "統合版",
          motd: extractMotdText(data.motd),
          icon: null,
          tps: null
        };
      }

      function parseMcSrvStatBedrock(data, address) {
        if (!data || data.online !== true) return null;
        const playersList =
          data.players && Array.isArray(data.players.list) ? data.players.list : [];
        return {
          edition: "BE",
          online: true,
          address,
          playersOnline: Number(data.players && data.players.online) || 0,
          playersMax: Number(data.players && data.players.max) || 0,
          players: normalizePlayers(playersList),
          version: data.version || "統合版",
          motd: extractMotdText(data.motd),
          icon: null,
          tps: null
        };
      }

      async function queryJavaEdition(address) {
        const encoded = encodeURIComponent(address);
        const ts = Date.now();
        const errors = [];

        try {
          const d1 = await fetchWithTimeout(
            `https://api.mcstatus.io/v2/status/java/${encoded}?_t=${ts}`
          );
          const parsed1 = parseMcStatusIoJava(d1, address);
          if (parsed1) return parsed1;
        } catch (err) {
          errors.push("mcstatus:" + (err && err.message ? err.message : "error"));
        }

        try {
          const d2 = await fetchWithTimeout(
            `https://api.mcsrvstat.us/3/${encoded}?_t=${ts}`
          );
          const parsed2 = parseMcSrvStatJava(d2, address);
          if (parsed2) return parsed2;
        } catch (err) {
          errors.push("mcsrvstat:" + (err && err.message ? err.message : "error"));
        }

        return { online: false, edition: "JE", errors };
      }

      async function queryBedrockEdition(address) {
        const encoded = encodeURIComponent(address);
        const ts = Date.now();
        const errors = [];

        try {
          const d1 = await fetchWithTimeout(
            `https://api.mcstatus.io/v2/status/bedrock/${encoded}?_t=${ts}`
          );
          const parsed1 = parseMcStatusIoBedrock(d1, address);
          if (parsed1) return parsed1;
        } catch (err) {
          errors.push("mcstatus:" + (err && err.message ? err.message : "error"));
        }

        try {
          const d2 = await fetchWithTimeout(
            `https://api.mcsrvstat.us/bedrock/3/${encoded}?_t=${ts}`
          );
          const parsed2 = parseMcSrvStatBedrock(d2, address);
          if (parsed2) return parsed2;
        } catch (err) {
          errors.push("mcsrvstat:" + (err && err.message ? err.message : "error"));
        }

        return { online: false, edition: "BE", errors };
      }

      async function probeAndFetchServer(server) {
        const generation = ++activeFetchGeneration;
        const prev = runtimeState.get(server.id) || {};
        const startTime = performance.now();

        runtimeState.set(server.id, {
          ...prev,
          status: "fetching",
          lastError: null
        });

        renderServerList();
        if (selectedServerId === server.id) {
          renderDetail(server.id, { preserveSearchFocus: true });
        }

        try {
          const [jeRes, beRes] = await Promise.all([
            queryJavaEdition(server.address),
            queryBedrockEdition(server.address)
          ]);

          const elapsedMs = Math.round(performance.now() - startTime);
          const jeOnline = Boolean(jeRes && jeRes.online);
          const beOnline = Boolean(beRes && beRes.online);

          let editionBadge = "オフライン";
          let isOnline = false;

          if (jeOnline && beOnline) {
            editionBadge = "両方対応 (JE+BE)";
            isOnline = true;
          } else if (jeOnline) {
            editionBadge = "JE対応";
            isOnline = true;
          } else if (beOnline) {
            editionBadge = "BE対応";
            isOnline = true;
          }

          let mergedPlayers = [];
          const seenNames = new Set();
          const sourceLists = [
            ...(jeOnline && Array.isArray(jeRes.players) ? jeRes.players : []),
            ...(beOnline && Array.isArray(beRes.players) ? beRes.players : [])
          ];
          for (const name of sourceLists) {
            const key = name.toLowerCase();
            if (!seenNames.has(key)) {
              seenNames.add(key);
              mergedPlayers.push(name);
            }
          }

          const playersOnline = isOnline
            ? (jeOnline ? jeRes.playersOnline : 0) + (beOnline ? beRes.playersOnline : 0)
            : 0;

          const playersMax = isOnline
            ? Math.max(
                jeOnline ? jeRes.playersMax : 0,
                beOnline ? beRes.playersMax : 0
              )
            : 0;

          const primary = jeOnline ? jeRes : beOnline ? beRes : null;
          const secondary = jeOnline && beOnline ? beRes : null;

          const motd = primary
            ? primary.motd || (secondary ? secondary.motd : "") || ""
            : "";

          const version =
            jeOnline && beOnline
              ? `JE: ${jeRes.version} / BE: ${beRes.version}`
              : primary
              ? primary.version
              : "-";

          const icon = (jeOnline && jeRes.icon) || (beOnline && beRes.icon) || DEFAULT_ICON_DATA_URI;

          const diagnosticErrors = [
            ...(jeRes && Array.isArray(jeRes.errors) ? jeRes.errors : []),
            ...(beRes && Array.isArray(beRes.errors) ? beRes.errors : [])
          ];

          runtimeState.set(server.id, {
            status: "done",
            online: isOnline,
            editionLabel: editionBadge,
            playersOnline,
            playersMax,
            players: mergedPlayers,
            version,
            motd,
            icon,
            apiResponseMs: elapsedMs,
            tps: null,
            updatedAt: new Date(),
            lastError: !isOnline && diagnosticErrors.length > 0 ? diagnosticErrors.join(" / ") : null
          });
        } catch (err) {
          const elapsedMs = Math.round(performance.now() - startTime);
          runtimeState.set(server.id, {
            status: "done",
            online: false,
            editionLabel: "オフライン",
            playersOnline: 0,
            playersMax: 0,
            players: [],
            version: "-",
            motd: "",
            icon: DEFAULT_ICON_DATA_URI,
            apiResponseMs: elapsedMs,
            tps: null,
            updatedAt: new Date(),
            lastError: err && err.message ? err.message : "取得エラー"
          });
        }

        renderServerList();
        if (selectedServerId === server.id) {
          const totalFiltered = getFilteredPlayers(server.id).length;
          const maxPage = Math.max(1, Math.ceil(totalFiltered / PAGE_SIZE));
          if (currentPage > maxPage) currentPage = maxPage;
          renderDetail(server.id, { preserveSearchFocus: generation === activeFetchGeneration });
        }
      }

      function renderServerList() {
        if (savedServers.length === 0) {
          elServerList.innerHTML =
            '<div class="empty-state" style="padding: 20px 12px;">登録されたサーバーはありません。</div>';
          return;
        }

        elServerList.innerHTML = "";
        for (const srv of savedServers) {
          const st = runtimeState.get(srv.id) || { status: "fetching", editionLabel: "取得中..." };
          const item = document.createElement("div");
          item.className = "server-item" + (srv.id === selectedServerId ? " active" : "");

          const main = document.createElement("div");
          main.className = "server-item-main";

          const title = document.createElement("div");
          title.className = "server-item-title";
          title.textContent = srv.label || srv.address;

          const addr = document.createElement("div");
          addr.className = "server-item-addr";
          addr.textContent = srv.address;

          const meta = document.createElement("div");
          meta.className = "server-item-meta";

          const statusBadge = document.createElement("span");
          if (st.status === "fetching") {
            statusBadge.className = "badge fetching";
            statusBadge.textContent = "取得中...";
          } else if (st.online) {
            statusBadge.className = "badge online";
            statusBadge.textContent = `オンライン (${st.playersOnline}/${st.playersMax})`;
          } else {
            statusBadge.className = "badge offline";
            statusBadge.textContent = "オフライン";
          }
          meta.appendChild(statusBadge);

          if (st.status === "done" && st.online && st.editionLabel) {
            const edBadge = document.createElement("span");
            edBadge.className = "badge edition";
            edBadge.textContent = st.editionLabel;
            meta.appendChild(edBadge);
          }

          main.appendChild(title);
          main.appendChild(addr);
          main.appendChild(meta);

          const delBtn = document.createElement("button");
          delBtn.type = "button";
          delBtn.className = "danger";
          delBtn.title = "削除";
          delBtn.textContent = "✕";
          delBtn.addEventListener("click", (ev) => {
            ev.stopPropagation();
            deleteServer(srv.id);
          });

          item.appendChild(main);
          item.appendChild(delBtn);

          item.addEventListener("click", () => {
            if (selectedServerId !== srv.id) {
              selectedServerId = srv.id;
              currentPage = 1;
              playerSearchQuery = "";
              renderServerList();
              renderDetail(srv.id, { preserveSearchFocus: false });
              probeAndFetchServer(srv);
            }
          });

          elServerList.appendChild(item);
        }
      }

      function deleteServer(id) {
        savedServers = savedServers.filter((s) => s.id !== id);
        runtimeState.delete(id);
        saveAddressesToCookie(savedServers);

        if (selectedServerId === id) {
          selectedServerId = savedServers.length > 0 ? savedServers[0].id : null;
          currentPage = 1;
          playerSearchQuery = "";
        }

        renderServerList();
        renderDetailEmptyOrSelected();
      }

      function renderDetailEmptyOrSelected() {
        if (!selectedServerId) {
          elDetailPanel.innerHTML =
            '<div class="empty-state">サーバーを追加するか、左の一覧からサーバーを選択してください。</div>';
          return;
        }
        renderDetail(selectedServerId, { preserveSearchFocus: false });
      }

      function getFilteredPlayers(serverId) {
        const st = runtimeState.get(serverId);
        const list = st && Array.isArray(st.players) ? st.players : [];
        const q = playerSearchQuery.trim().toLowerCase();
        if (!q) return list;
        return list.filter((name) => name.toLowerCase().includes(q));
      }

      function renderDetail(serverId, opts = { preserveSearchFocus: false }) {
        const server = savedServers.find((s) => s.id === serverId);
        if (!server) {
          renderDetailEmptyOrSelected();
          return;
        }

        const st = runtimeState.get(server.id) || {
          status: "fetching",
          online: false,
          editionLabel: "取得中...",
          playersOnline: 0,
          playersMax: 0,
          players: [],
          version: "-",
          motd: "",
          icon: DEFAULT_ICON_DATA_URI,
          apiResponseMs: null,
          tps: null,
          updatedAt: null,
          lastError: null
        };

        const activeEl = document.activeElement;
        const wasSearching =
          opts.preserveSearchFocus && activeEl && activeEl.id === "player-search-input";
        const selStart = wasSearching ? activeEl.selectionStart : null;
        const selEnd = wasSearching ? activeEl.selectionEnd : null;

        const statusText =
          st.status === "fetching"
            ? "取得中..."
            : st.online
            ? `オンライン (${st.editionLabel})`
            : "オフライン";

        const apiRespText =
          typeof st.apiResponseMs === "number" ? `${st.apiResponseMs} ms` : "-";

        const tpsText =
          st.tps !== null && st.tps !== undefined ? String(st.tps) : "非公開 (SLP仕様)";

        const updatedText = st.updatedAt
          ? st.updatedAt.toLocaleTimeString("ja-JP", { hour12: false })
          : "-";

        elDetailPanel.innerHTML = "";

        const header = document.createElement("div");
        header.className = "detail-header";

        const titleWrap = document.createElement("div");
        titleWrap.className = "detail-title-wrap";

        const iconImg = document.createElement("img");
        iconImg.className = "server-icon";
        iconImg.alt = server.address;
        iconImg.src = st.icon || DEFAULT_ICON_DATA_URI;
        iconImg.onerror = () => {
          iconImg.onerror = null;
          iconImg.src = DEFAULT_ICON_DATA_URI;
        };

        const titleTextWrap = document.createElement("div");
        const h2 = document.createElement("h2");
        h2.className = "detail-title";
        h2.textContent = server.label || server.address;

        const sub = document.createElement("div");
        sub.className = "detail-sub";
        sub.textContent = `${server.address} ・ 最終更新: ${updatedText}`;

        titleTextWrap.appendChild(h2);
        titleTextWrap.appendChild(sub);
        titleWrap.appendChild(iconImg);
        titleWrap.appendChild(titleTextWrap);

        const reloadBtn = document.createElement("button");
        reloadBtn.type = "button";
        reloadBtn.textContent = st.status === "fetching" ? "取得中..." : "今すぐ更新";
        reloadBtn.disabled = st.status === "fetching";
        reloadBtn.addEventListener("click", () => {
          probeAndFetchServer(server);
        });

        header.appendChild(titleWrap);
        header.appendChild(reloadBtn);
        elDetailPanel.appendChild(header);

        const statsGrid = document.createElement("div");
        statsGrid.className = "stats-grid";

        statsGrid.appendChild(
          createStatCard(
            "状態 / 対応",
            statusText,
            st.lastError ? `通信メモ: ${st.lastError}` : "Java/Bedrock自動判定"
          )
        );
        statsGrid.appendChild(
          createStatCard(
            "参加人数",
            `${st.playersOnline} / ${st.playersMax}`,
            `取得済みユーザー名: ${st.players.length}人`
          )
        );
        statsGrid.appendChild(
          createStatCard(
            "TPS",
            tpsText,
            "標準Server List Pingでは内部TPSは非公開です"
          )
        );
        statsGrid.appendChild(
          createStatCard(
            "API応答時間",
            apiRespText,
            "ステータスAPIから応答が返るまでの所要時間"
          )
        );
        statsGrid.appendChild(createStatCard("バージョン", st.version || "-", ""));

        elDetailPanel.appendChild(statsGrid);

        const motdBox = document.createElement("div");
        motdBox.className = "motd-box";
        motdBox.textContent = st.motd
          ? `MOTD:\n${st.motd}`
          : st.status === "fetching"
          ? "MOTDを取得中..."
          : "MOTD情報なし / オフライン";
        elDetailPanel.appendChild(motdBox);

        const toolbar = document.createElement("div");
        toolbar.className = "players-toolbar";

        const playersHeading = document.createElement("div");
        playersHeading.style.fontWeight = "700";
        playersHeading.textContent = "参加プレイヤー一覧 (1ページ50人)";

        const searchInput = document.createElement("input");
        searchInput.type = "search";
        searchInput.id = "player-search-input";
        searchInput.placeholder = "プレイヤー名で検索...";
        searchInput.value = playerSearchQuery;
        searchInput.addEventListener("input", (ev) => {
          playerSearchQuery = ev.target.value;
          currentPage = 1;
          renderPlayersSectionOnly(server.id);
        });

        toolbar.appendChild(playersHeading);
        toolbar.appendChild(searchInput);
        elDetailPanel.appendChild(toolbar);

        const playersContainer = document.createElement("div");
        playersContainer.id = "players-section-container";
        elDetailPanel.appendChild(playersContainer);

        renderPlayersSectionOnly(server.id);

        if (wasSearching) {
          const restoredInput = document.getElementById("player-search-input");
          if (restoredInput) {
            restoredInput.focus();
            if (typeof selStart === "number" && typeof selEnd === "number") {
              try {
                restoredInput.setSelectionRange(selStart, selEnd);
              } catch (_) {}
            }
          }
        }
      }

      function createStatCard(label, value, note) {
        const card = document.createElement("div");
        card.className = "stat-card";

        const lbl = document.createElement("div");
        lbl.className = "stat-label";
        lbl.textContent = label;

        const val = document.createElement("div");
        val.className = "stat-value";
        val.textContent = value;

        card.appendChild(lbl);
        card.appendChild(val);

        if (note) {
          const n = document.createElement("div");
          n.className = "stat-note";
          n.textContent = note;
          card.appendChild(n);
        }

        return card;
      }

      function attachHeadFallbackChain(imgEl, playerName) {
        const encoded = encodeURIComponent(playerName);
        const fallbacks = [
          `https://minotar.net/helm/${encoded}/24.png`,
          `https://mc-heads.net/avatar/${encoded}/24`,
          `https://crafatar.com/avatars/${encoded}?size=24&overlay`,
          DEFAULT_HEAD_DATA_URI
        ];
        let idx = 0;
        imgEl.src = fallbacks[0];
        imgEl.onerror = () => {
          idx += 1;
          if (idx < fallbacks.length) {
            imgEl.src = fallbacks[idx];
          } else {
            imgEl.onerror = null;
          }
        };
      }

      function renderPlayersSectionOnly(serverId) {
        const container = document.getElementById("players-section-container");
        if (!container) return;

        const st = runtimeState.get(serverId);
        const filtered = getFilteredPlayers(serverId);
        const totalItems = filtered.length;
        const totalPages = Math.max(1, Math.ceil(totalItems / PAGE_SIZE));
        if (currentPage > totalPages) currentPage = totalPages;

        const startIdx = (currentPage - 1) * PAGE_SIZE;
        const pageItems = filtered.slice(startIdx, startIdx + PAGE_SIZE);

        container.innerHTML = "";

        if (st && st.status === "fetching" && (!st.players || st.players.length === 0)) {
          container.innerHTML =
            '<div class="empty-state">プレイヤー情報を取得中...</div>';
          return;
        }

        if (totalItems === 0) {
          container.innerHTML =
            '<div class="empty-state">表示できる参加プレイヤーがありません。</div>';
          return;
        }

        const grid = document.createElement("div");
        grid.className = "players-grid";

        for (const name of pageItems) {
          const card = document.createElement("div");
          card.className = "player-card";

          const head = document.createElement("img");
          head.className = "player-head";
          head.alt = name;
          attachHeadFallbackChain(head, name);

          const label = document.createElement("span");
          label.className = "player-name";
          label.title = name;
          label.textContent = name;

          card.appendChild(head);
          card.appendChild(label);
          grid.appendChild(card);
        }

        container.appendChild(grid);

        const summary = document.createElement("div");
        summary.className = "help-text";
        summary.style.textAlign = "center";
        summary.textContent = `全 ${totalItems} 件中 ${startIdx + 1} 〜 ${Math.min(
          startIdx + PAGE_SIZE,
          totalItems
        )} 件を表示 (${currentPage} / ${totalPages} ページ)`;
        container.appendChild(summary);

        if (totalPages > 1) {
          const nav = document.createElement("div");
          nav.className = "pagination";

          const prevBtn = document.createElement("button");
          prevBtn.type = "button";
          prevBtn.textContent = "前へ";
          prevBtn.disabled = currentPage <= 1;
          prevBtn.addEventListener("click", () => {
            if (currentPage > 1) {
              currentPage -= 1;
              renderPlayersSectionOnly(serverId);
            }
          });
          nav.appendChild(prevBtn);

          for (let p = 1; p <= totalPages; p += 1) {
            const pageBtn = document.createElement("button");
            pageBtn.type = "button";
            pageBtn.textContent = String(p);
            if (p === currentPage) {
              pageBtn.className = "active-page";
            }
            pageBtn.addEventListener("click", () => {
              currentPage = p;
              renderPlayersSectionOnly(serverId);
            });
            nav.appendChild(pageBtn);
          }

          const nextBtn = document.createElement("button");
          nextBtn.type = "button";
          nextBtn.textContent = "次へ";
          nextBtn.disabled = currentPage >= totalPages;
          nextBtn.addEventListener("click", () => {
            if (currentPage < totalPages) {
              currentPage += 1;
              renderPlayersSectionOnly(serverId);
            }
          });
          nav.appendChild(nextBtn);

          container.appendChild(nav);
        }
      }
    })();
  </script>
</body>
</html>
