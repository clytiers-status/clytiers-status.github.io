<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MC Live Monitor - マイクラ リアルタイムサーバーステータス</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter, Noto Sans JP, JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Inter"', '"Noto Sans JP"', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace'],
                    },
                    colors: {
                        bg: {
                            base: '#0d1117',
                            surface: '#161b22',
                            elevated: '#1f2630',
                            border: '#30363d',
                        },
                        mc: {
                            emerald: '#10b981',
                            emeraldGlow: 'rgba(16, 185, 129, 0.25)',
                            crimson: '#ef4444',
                            gold: '#f59e0b',
                            diamond: '#38bdf8',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0d1117;
            color: #e6edf3;
            background-image:
                radial-gradient(circle at 10% 10%, rgba(16, 185, 129, 0.05), transparent 30%),
                radial-gradient(circle at 90% 80%, rgba(56, 189, 248, 0.05), transparent 30%);
        }
        .pixelated {
            image-rendering: pixelated;
        }
        /* マイクラゲーム内チャット風MOTDボックス */
        .mc-motd-box {
            background-color: #101216;
            background-image: linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 16px 16px;
            font-family: 'JetBrains Mono', 'Noto Sans JP', monospace;
            text-shadow: 1.5px 1.5px 0px rgba(0, 0, 0, 0.85);
            line-height: 1.55;
        }
        /* カスタムスクロールバー */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0d1117;
        }
        ::-webkit-scrollbar-thumb {
            background: #30363d;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #484f58;
        }
        @keyframes toastSlide {
            from { transform: translateY(16px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .toast-anim {
            animation: toastSlide 0.2s ease-out forwards;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col antialiased selection:bg-mc-emerald selection:text-slate-950">

    <!-- トップナビゲーションバー -->
    <header class="sticky top-0 z-40 bg-bg-surface/90 backdrop-blur-md border-b border-bg-border">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3.5 flex flex-wrap items-center justify-between gap-3">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-emerald-400 to-teal-700 p-0.5 shadow-lg shrink-0">
                    <div class="w-full h-full bg-bg-base rounded-[10px] flex items-center justify-center">
                        <i class="fa-solid fa-satellite-dish text-mc-emerald text-lg"></i>
                    </div>
                </div>
                <div>
                    <div class="flex items-center gap-2">
                        <h1 class="text-base sm:text-lg font-extrabold tracking-tight text-white">MC LIVE MONITOR</h1>
                        <span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-mc-emerald/15 text-mc-emerald border border-mc-emerald/30">REALTIME API</span>
                    </div>
                    <p class="text-xs text-slate-400">実サーバー通信ステータス・参加プレイヤー・MOTD・TPS/Ping監視</p>
                </div>
            </div>

            <!-- 右側コントロール -->
            <div class="flex items-center gap-2 sm:gap-3">
                <div class="hidden sm:flex items-center gap-1.5 text-xs px-3 py-1.5 rounded-lg bg-bg-elevated border border-bg-border text-slate-300" title="登録サーバー一覧はブラウザのCookieに自動保存されます">
                    <i class="fa-solid fa-cookie-bite text-amber-400"></i>
                    <span id="cookie-status-text">Cookie保存中</span>
                </div>
                <button onclick="refreshAllServers()" id="refresh-all-btn" class="text-xs font-bold px-3.5 py-2 rounded-xl bg-bg-elevated hover:bg-slate-700 text-white border border-bg-border transition flex items-center gap-1.5 cursor-pointer">
                    <i class="fa-solid fa-arrows-rotate" id="refresh-all-icon"></i>
                    <span>すべて更新</span>

    <!-- メインコンテンツ (2カラム: 左にサーバー一覧、右に詳細ビュー) -->

        <!-- 左カラム: サーバー追加フォーム & 登録済みサーバーリスト (5カラム) -->
        <div class="lg:col-span-5 space-y-5">

            <!-- サーバー追加カード -->
            <section class="bg-bg-surface border border-bg-border rounded-2xl p-4 sm:p-5 shadow-lg space-y-3.5">
                <div class="flex items-center justify-between">
                    <h2 class="text-sm font-bold text-white flex items-center gap-2">
                        <i class="fa-solid fa-plus-circle text-mc-emerald"></i>
                        <span>サーバーを追加して監視</span>
                    </h2>
                    <span class="text-[11px] text-slate-400">ポート指定可 (例: :25565)</span>
                </div>

                <form onsubmit="handleAddServer(event)" class="space-y-2.5">
                    <div class="flex flex-col sm:flex-row gap-2">
                        <input type="text" id="add-address-input" required
                            placeholder="サーバーアドレス (例: mc.hypixel.net)"
                            class="flex-1 bg-bg-base border border-bg-border focus:border-mc-emerald rounded-xl px-3.5 py-2.5 text-sm font-mono text-white placeholder-slate-500 outline-none transition">
                        <select id="add-edition-select"
                            class="bg-bg-base border border-bg-border focus:border-mc-emerald rounded-xl px-3 py-2.5 text-sm font-bold text-slate-200 outline-none">

                            <i class="fa-solid fa-satellite-dish"></i>
                            <span>追加・取得</span>

                    </div>
                </form>

                <!-- ワンクリックお試しサーバー（実際に参加ユーザー名やMOTDが返ってくるサーバー） -->
                <div class="pt-2 border-t border-bg-border/70">
                    <div class="text-[11px] text-slate-400 mb-1.5 flex items-center gap-1">
                        <i class="fa-solid fa-bolt text-amber-400"></i>

                            + mc.hypixel.net

                        <button type="button" onclick="quickAddPreset('play.cubecraft.net', 'java', 'CubeCraft Games')" class="text-[11px] font-mono px-2.5 py-1 rounded-lg bg-bg-elevated hover:bg-slate-700 text-slate-300 border border-bg-border transition cursor-pointer">
                            + play.cubecraft.net
                        </button>
                        <button type="button" onclick="quickAddPreset('2b2t.org', 'java', '2b2t Anarchy')" class="text-[11px] font-mono px-2.5 py-1 rounded-lg bg-bg-elevated hover:bg-slate-700 text-slate-300 border border-bg-border transition cursor-pointer">
                            + 2b2t.org
                        </button>
                        <button type="button" onclick="quickAddPreset('play.inpvp.net', 'bedrock', 'Mineville (BE)')" class="text-[11px] font-mono px-2.5 py-1 rounded-lg bg-bg-elevated hover:bg-slate-700 text-slate-300 border border-bg-border transition cursor-pointer">
                            + play.inpvp.net (BE)
                        </button>
                        <button type="button" onclick="quickAddPreset('play.cubecraft.net', 'multi', 'CubeCraft (Java+BE)')" class="text-[11px] font-mono px-2.5 py-1 rounded-lg bg-bg-elevated hover:bg-slate-700 text-slate-300 border border-bg-border transition cursor-pointer">
                            + CubeCraft (マルチ)

            <!-- 登録済みサーバーリスト -->

                    <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400 flex items-center gap-2">

                        <span id="server-count-badge" class="px-2 py-0.5 rounded-full bg-bg-elevated text-slate-300 font-mono">0</span>
                    </h3>
                    <span class="text-[11px] text-slate-500">クリックで詳細表示</span>
                </div>

                <div id="server-list-container" class="space-y-2.5">
                    <!-- JSでサーバーカードをレンダリング -->
                </div>
            </section>
        </div>

        <!-- 右カラム: 選択されたサーバーのリアルタイム詳細ビュー (7カラム) -->
        <div class="lg:col-span-7" id="detail-panel-wrapper">
            <!-- JSで詳細パネルをレンダリング -->
        </div>

    </main>

    <!-- 削除確認モーダル -->
    <div id="delete-modal" class="fixed inset-0 z-50 bg-black/75 backdrop-blur-sm hidden items-center justify-center p-4">
        <div class="bg-bg-surface border border-bg-border rounded-2xl max-w-sm w-full p-5 space-y-4 shadow-2xl">
            <div class="flex items-start gap-3">
                <div class="w-10 h-10 rounded-xl bg-red-500/15 border border-red-500/30 text-red-400 flex items-center justify-center shrink-0">
                    <i class="fa-solid fa-trash-can"></i>
                </div>
                <div>
                    <h4 class="font-bold text-white text-sm">サーバーをリストから削除しますか？</h4>
                    <p id="delete-modal-target" class="text-xs font-mono text-slate-400 mt-1 break-all"></p>
                </div>
            </div>
            <div class="flex justify-end gap-2 pt-1">
                <button onclick="closeDeleteModal()" class="px-3.5 py-2 rounded-xl text-xs font-bold bg-bg-elevated text-slate-300 hover:bg-slate-700 cursor-pointer">キャンセル</button>
                <button onclick="confirmDeleteServer()" class="px-3.5 py-2 rounded-xl text-xs font-bold bg-red-600 text-white hover:bg-red-500 cursor-pointer">削除する</button>
            </div>
        </div>
    </div>

    <!-- トースト通知エリア -->
    <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <script>
        // ==========================================
        // フォールバック用 デフォルト草ブロックSVGアイコン
        // ==========================================
        const DEFAULT_ICON_SVG = "data:image/svg+xml;utf8," + encodeURIComponent(`
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
                <rect width="64" height="64" fill="#4e342e"/>
                <rect width="64" height="18" fill="#10b981"/>
                <rect x="0" y="18" width="10" height="6" fill="#10b981"/>
                <rect x="18" y="18" width="12" height="8" fill="#10b981"/>
                <rect x="40" y="18" width="8" height="6" fill="#10b981"/>
                <rect x="54" y="18" width="10" height="7" fill="#10b981"/>
                <rect x="12" y="34" width="8" height="6" fill="#3e2723"/>
                <rect x="42" y="44" width="8" height="6" fill="#3e2723"/>
            </svg>
        `);

        // ==========================================
        // Cookie & LocalStorage 永続化管理
        // ==========================================
        const COOKIE_KEY = 'mc_live_servers_v2';
        const STORAGE_KEY = 'mc_live_servers_backup_v2';

        function writeCookie(name, value, maxAgeSec = 31536000) {
            try {
                document.cookie = `${name}=${encodeURIComponent(value)}; max-age=${maxAgeSec}; path=/; SameSite=Lax`;
            } catch (e) {
                console.warn('Cookie書き込み失敗:', e);
            }
        }

        function readCookie(name) {
            try {
                const pairs = document.cookie ? document.cookie.split('; ') : [];
                for (const pair of pairs) {
                    const idx = pair.indexOf('=');
                    if (idx === -1) continue;
                    const k = pair.slice(0, idx);
                    if (k === name) {
                        return decodeURIComponent(pair.slice(idx + 1));
                    }
                }
            } catch (e) {
                console.warn('Cookie読み込み失敗:', e);
            }
            return null;
        }

        // ==========================================
        // アプリケーション状態
        // ==========================================
        let savedServers = [];      // { id, address, edition, label } ※Cookieにはこの4項目のみ保存
        let statusCache = {};       // { [id]: { loading, error, data, fetchedAt } }
        let selectedServerId = null;
        let playerSearchQuery = '';
        let currentPlayerPage = 1;
        const PLAYERS_PER_PAGE = 50;
        let autoRefreshEnabled = false;
        let autoRefreshTimer = null;
        let pendingDeleteId = null;

        // Mojang公式スキンテクスチャのメモリキャッシュ（Cookieには保存しない）
        const officialSkinCache = new Map();

        /**
         * サーバー登録リスト（アドレス情報のみ）をCookieに保存
         */
        function persistServers() {
            const minimalList = savedServers.map(s => ({
                id: s.id,
                address: s.address,
                edition: s.edition,
                label: s.label || ''
            }));
            const serialized = JSON.stringify(minimalList);
            writeCookie(COOKIE_KEY, serialized, 31536000);
            try {
                localStorage.setItem(STORAGE_KEY, serialized);
            } catch (e) {}

            const badge = document.getElementById('cookie-status-text');
            if (badge) {
                const now = new Date();
                badge.textContent = `Cookie保存済 (${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')})`;
            }
        }

        /**
         * Cookie（またはバックアップ）から登録サーバーを復元
         */
        function restoreServers() {
            let raw = readCookie(COOKIE_KEY);
            if (!raw) {
                try {
                    raw = localStorage.getItem(STORAGE_KEY);
                } catch (e) {}
            }

            if (raw) {
                try {
                    const parsed = JSON.parse(raw);
                    if (Array.isArray(parsed)) {
                        savedServers = parsed;
                    }
                } catch (e) {
                    console.error('保存データのパースに失敗:', e);
                }
            }

            // 初回起動時（Cookieが空のとき）は代表的な実在サーバーを1件だけ初期登録しておく
            if (savedServers.length === 0) {
                savedServers = [
                    {
                        id: 'srv_init_1',
                        address: 'mc.hypixel.net',
                        edition: 'java',
                        label: 'Hypixel Network'
                    }
                ];
                persistServers();
            }

            if (savedServers.length > 0 && !selectedServerId) {
                selectedServerId = savedServers[0].id;
            }
        }

        // ==========================================
        // 実マイクラサーバーAPI通信処理 (Java / Bedrock / Multi対応)
        // ==========================================
        async function fetchSingleEditionEndpoint(address, edition) {
            const startTime = performance.now();
            const encodedAddr = encodeURIComponent(address.trim());
            const isBedrock = edition === 'bedrock';

            const primaryUrl = isBedrock
                ? `https://api.mcsrvstat.us/bedrock/3/${encodedAddr}`
                : `https://api.mcsrvstat.us/3/${encodedAddr}`;

            const fallbackUrl = isBedrock
                ? `https://api.mcstatus.io/v2/status/bedrock/${encodedAddr}`
                : `https://api.mcstatus.io/v2/status/java/${encodedAddr}`;

            // 両APIから並列取得して、より多くのプレイヤーリストや詳細情報を補完
            const [res1, res2] = await Promise.allSettled([
                fetch(primaryUrl, { cache: 'no-store' }).then(async r => {
                    if (!r.ok) throw new Error(`HTTP ${r.status}`);
                    const json = await r.json();
                    return normalizeMcsrvstatData(json, { address, edition }, Math.round(performance.now() - startTime));
                }),
                fetch(fallbackUrl, { cache: 'no-store' }).then(async r => {
                    if (!r.ok) throw new Error(`HTTP ${r.status}`);
                    const json = await r.json();
                    return normalizeMcstatusIoData(json, { address, edition }, Math.round(performance.now() - startTime));
                })
            ]);

            const d1 = res1.status === 'fulfilled' ? res1.value : null;
            const d2 = res2.status === 'fulfilled' ? res2.value : null;

            if (!d1 && !d2) {
                throw new Error('Both status APIs failed');
            }

            const base = (d1 && d1.online) ? d1 : ((d2 && d2.online) ? d2 : (d1 || d2));
            const secondary = base === d1 ? d2 : d1;

            // 両方のAPIから返されたプレイヤーリストを重複排除して統合
            const mergedMap = new Map();
            const addPlayers = (list, sourceEdition) => {
                if (!Array.isArray(list)) return;
                for (const p of list) {
                    const key = p.name.toLowerCase();
                    if (!mergedMap.has(key)) {
                        mergedMap.set(key, { ...p, platform: sourceEdition });
                    } else if (!mergedMap.get(key).uuid && p.uuid) {
                        mergedMap.get(key).uuid = p.uuid;
                    }
                }
            };
            addPlayers(base?.playerList, edition);
            addPlayers(secondary?.playerList, edition);

            return {
                ...base,
                playerList: Array.from(mergedMap.values()),
                detectedTps: base.detectedTps ?? secondary?.detectedTps ?? null,
                plugins: base.plugins.length > 0 ? base.plugins : (secondary?.plugins || []),
                mods: base.mods.length > 0 ? base.mods : (secondary?.mods || [])
            };
        }

        async function fetchServerStatus(server) {
            const id = server.id;
            statusCache[id] = {
                ...(statusCache[id] || {}),
                loading: true,
                error: null
            };
            renderServerList();
            if (selectedServerId === id) renderDetailPanel();

            try {
                let normalizedData = null;

                if (server.edition === 'multi') {
                    // マルチプレイ（Java版 + 統合版 両対応）の場合は両方を同時取得して統合
                    const [javaRes, bedrockRes] = await Promise.allSettled([
                        fetchSingleEditionEndpoint(server.address, 'java'),
                        fetchSingleEditionEndpoint(server.address, 'bedrock')
                    ]);

                    const jData = javaRes.status === 'fulfilled' ? javaRes.value : null;
                    const bData = bedrockRes.status === 'fulfilled' ? bedrockRes.value : null;

                    if (!jData && !bData) {
                        throw new Error('Java/Bedrock両方の取得に失敗しました');
                    }

                    const jOnline = Boolean(jData?.online);
                    const bOnline = Boolean(bData?.online);
                    const anyOnline = jOnline || bOnline;
                    const primary = jOnline ? jData : (bOnline ? bData : (jData || bData));

                    // JavaとBedrockのプレイヤーリストを統合（重複除外）
                    const playerMap = new Map();
                    if (jData?.playerList) {
                        jData.playerList.forEach(p => playerMap.set(p.name.toLowerCase(), { ...p, platform: 'java' }));
                    }
                    if (bData?.playerList) {
                        bData.playerList.forEach(p => {
                            const key = p.name.toLowerCase();
                            if (!playerMap.has(key)) {
                                playerMap.set(key, { ...p, platform: 'bedrock' });
                            }
                        });
                    }

                    // 同一サーバー(Geyser)の場合はJava側の合計人数を基準にしつつ、別ポート稼働で合計が異なる場合は大きい方を採用
                    const totalOnline = Math.max(jData?.playersOnline || 0, bData?.playersOnline || 0);
                    const totalMax = Math.max(jData?.playersMax || 0, bData?.playersMax || 0);

                    normalizedData = {
                        ...primary,
                        online: anyOnline,
                        isMulti: true,
                        multiDetails: {
                            java: jData,
                            bedrock: bData
                        },
                        version: [
                            jOnline ? `JE: ${jData.version}` : null,
                            bOnline ? `BE: ${bData.version}` : null
                        ].filter(Boolean).join(' / ') || primary.version,
                        playersOnline: totalOnline,
                        playersMax: totalMax,
                        playerList: Array.from(playerMap.values()),
                        pingMs: jOnline && bOnline
                            ? Math.round((jData.pingMs + bData.pingMs) / 2)
                            : primary.pingMs,
                        detectedTps: jData?.detectedTps ?? bData?.detectedTps ?? null
                    };
                } else {
                    normalizedData = await fetchSingleEditionEndpoint(server.address, server.edition);
                }

                statusCache[id] = {
                    loading: false,
                    error: null,
                    data: normalizedData,
                    fetchedAt: new Date()
                };
            } catch (err) {
                statusCache[id] = {
                    loading: false,
                    error: 'サーバーへの接続またはAPI取得に失敗しました。アドレスとポートを確認してください。',
                    data: null,
                    fetchedAt: new Date()
                };
            }

            renderServerList();
            if (selectedServerId === id) renderDetailPanel();
        }

        /**
         * mcsrvstat.us v3 のレスポンスを統一フォーマットへ変換
         */
        function normalizeMcsrvstatData(raw, server, apiLatencyMs) {
            const online = Boolean(raw.online);

            // プレイヤーリストの抽出
            let playerList = [];
            if (raw.players && Array.isArray(raw.players.list)) {
                playerList = raw.players.list.map(p => ({
                    name: typeof p === 'string' ? p : (p.name || 'Unknown'),
                    uuid: typeof p === 'object' && p.uuid ? p.uuid : null
                }));
            }

            // MOTD (HTML優先、なければclean/raw)
            let motdHtml = '';
            let motdClean = '';
            if (raw.motd) {
                if (Array.isArray(raw.motd.html)) {
                    motdHtml = raw.motd.html.join('<br>');
                } else if (Array.isArray(raw.motd.clean)) {
                    motdHtml = escapeHTML(raw.motd.clean.join('\n')).replace(/\n/g, '<br>');
                }
                if (Array.isArray(raw.motd.clean)) {
                    motdClean = raw.motd.clean.join('\n');
                }
            }

            // プラグイン / MOD一覧の抽出
            let plugins = [];
            if (Array.isArray(raw.plugins)) {
                plugins = raw.plugins.map(pl => typeof pl === 'string' ? pl : `${pl.name}${pl.version ? ' ' + pl.version : ''}`);
            }
            let mods = [];
            if (Array.isArray(raw.mods)) {
                mods = raw.mods.map(m => typeof m === 'string' ? m : `${m.name}${m.version ? ' ' + m.version : ''}`);
            }

            // サーバー情報やMOTDからTPS表記が含まれているか検出（一部サーバーはQuery/MOTDにTPSを載せている）
            const detectedTps = extractTpsFromText(motdClean + ' ' + JSON.stringify(raw.info || ''));

            return {
                online,
                hostname: raw.hostname || server.address,
                ip: raw.ip || '非公開',
                port: raw.port || (server.edition === 'bedrock' ? 19132 : 25565),
                version: raw.version || '不明',
                protocol: raw.protocol ? `${raw.protocol.name || ''} (${raw.protocol.version ?? raw.protocol})` : '不明',
                software: raw.software || null,
                icon: raw.icon || DEFAULT_ICON_SVG,
                playersOnline: raw.players ? (raw.players.online ?? 0) : 0,
                playersMax: raw.players ? (raw.players.max ?? 0) : 0,
                playerList,
                motdHtml: motdHtml || '<span class="text-slate-500">MOTDなし</span>',
                motdClean,
                map: raw.map && raw.map.clean ? raw.map.clean : (typeof raw.map === 'string' ? raw.map : null),
                gamemode: raw.gamemode || null,
                plugins,
                mods,
                detectedTps,
                pingMs: apiLatencyMs,
                debugInfo: {
                    ping: raw.debug?.ping ?? online,
                    query: raw.debug?.query ?? false,
                    srv: raw.debug?.srv ?? false,
                    cacheTime: raw.debug?.cachetime || null
                }
            };
        }

        /**
         * mcstatus.io v2 のフォールバックレスポンス変換
         */
        function normalizeMcstatusIoData(raw, server, apiLatencyMs) {
            const online = Boolean(raw.online);
            let playerList = [];
            if (raw.players && Array.isArray(raw.players.list)) {
                playerList = raw.players.list.map(p => ({
                    name: p.name_clean || p.name_raw || 'Unknown',
                    uuid: p.uuid || null
                }));
            }
            const motdHtml = raw.motd && raw.motd.html
                ? raw.motd.html
                : escapeHTML(raw.motd?.clean || 'MOTDなし').replace(/\n/g, '<br>');
            const motdClean = raw.motd?.clean || '';

            return {
                online,
                hostname: raw.host || server.address,
                ip: raw.ip_address || '非公開',
                port: raw.port || (server.edition === 'bedrock' ? 19132 : 25565),
                version: raw.version?.name_clean || raw.version?.name || '不明',
                protocol: raw.version?.protocol ? String(raw.version.protocol) : '不明',
                software: raw.software || null,
                icon: raw.icon || DEFAULT_ICON_SVG,
                playersOnline: raw.players?.online ?? 0,
                playersMax: raw.players?.max ?? 0,
                playerList,
                motdHtml,
                motdClean,
                map: null,
                gamemode: raw.gamemode || null,
                plugins: Array.isArray(raw.plugins) ? raw.plugins.map(p => p.name) : [],
                mods: Array.isArray(raw.mods) ? raw.mods.map(m => m.name) : [],
                detectedTps: extractTpsFromText(motdClean),
                pingMs: apiLatencyMs,
                debugInfo: {
                    ping: online,
                    query: false,
                    srv: Boolean(raw.srv_record),
                    cacheTime: null
                }
            };
        }

        /**
         * サーバーがMOTDやInfoに "TPS: 20.0" などを公開している場合に数値を抽出
         */
        function extractTpsFromText(text) {
            if (!text) return null;
            const match = text.match(/TPS[:\s=]*([0-9]{1,2}(?:\.[0-9]{1,2})?)/i);
            if (match && match[1]) {
                const val = parseFloat(match[1]);
                if (val >= 0 && val <= 20.5) return val;
            }
            return null;
        }

        async function refreshAllServers() {
            if (savedServers.length === 0) return;
            const icon = document.getElementById('refresh-all-icon');
            icon.classList.add('animate-spin');
            await Promise.all(savedServers.map(s => fetchServerStatus(s)));
            icon.classList.remove('animate-spin');
            showToast('全サーバーの最新ステータスを更新しました');
        }

        // ==========================================
        // サーバー追加・選択・並べ替え・削除
        // ==========================================
        function handleAddServer(event) {
            event.preventDefault();
            const addrInput = document.getElementById('add-address-input');
            const editionSelect = document.getElementById('add-edition-select');
            const labelInput = document.getElementById('add-label-input');

            const address = addrInput.value.trim();
            if (!address) return;

            addServerInternal(address, editionSelect.value, labelInput.value.trim());

            addrInput.value = '';
            labelInput.value = '';
        }

        function quickAddPreset(address, edition, label) {
            addServerInternal(address, edition, label);
        }

        function addServerInternal(address, edition, label) {
            // 既に同じアドレス・エディションが存在する場合は選択して再取得
            const existing = savedServers.find(
                s => s.address.toLowerCase() === address.toLowerCase() && s.edition === edition
            );
            if (existing) {
                selectedServerId = existing.id;
                playerSearchQuery = '';
                currentPlayerPage = 1;
                fetchServerStatus(existing);
                showToast(`「${address}」は既に登録済みのため最新情報を取得します`);
                return;
            }

            const newServer = {
                id: 'srv_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
                address,
                edition,
                label
            };

            savedServers.unshift(newServer);
            selectedServerId = newServer.id;
            playerSearchQuery = '';
            currentPlayerPage = 1;

            persistServers();
            renderServerList();
            renderDetailPanel();
            fetchServerStatus(newServer);
            showToast(`「${address}」を追加してCookieに保存しました`);
        }

        function selectServer(id) {
            selectedServerId = id;
            playerSearchQuery = '';
            currentPlayerPage = 1;
            renderServerList();
            renderDetailPanel();

            // モバイル画面では詳細パネルへスムーズスクロール
            if (window.innerWidth < 1024) {
                document.getElementById('detail-panel-wrapper').scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        }

        function moveServer(event, id, direction) {
            event.stopPropagation();
            const idx = savedServers.findIndex(s => s.id === id);
            if (idx === -1) return;
            const targetIdx = idx + direction;
            if (targetIdx < 0 || targetIdx >= savedServers.length) return;

            const temp = savedServers[idx];
            savedServers[idx] = savedServers[targetIdx];
            savedServers[targetIdx] = temp;

            persistServers();
            renderServerList();
        }

        function promptDeleteServer(event, id) {
            event.stopPropagation();
            const srv = savedServers.find(s => s.id === id);
            if (!srv) return;
            pendingDeleteId = id;
            document.getElementById('delete-modal-target').textContent = `${srv.label ? srv.label + ' — ' : ''}${srv.address}`;
            const modal = document.getElementById('delete-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeDeleteModal() {
            pendingDeleteId = null;
            const modal = document.getElementById('delete-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        function confirmDeleteServer() {
            if (!pendingDeleteId) return;
            savedServers = savedServers.filter(s => s.id !== pendingDeleteId);
            delete statusCache[pendingDeleteId];

            if (selectedServerId === pendingDeleteId) {
                selectedServerId = savedServers.length > 0 ? savedServers[0].id : null;
            }

            persistServers();
            renderServerList();
            renderDetailPanel();
            closeDeleteModal();
            showToast('サーバーを削除しました');
        }

        /**
         * オンラインプレイヤー一覧グリッド＋1ページ50人のページネーションHTMLを生成
         */
        function buildPlayersAreaHTML(data) {
            if (data.playersOnline === 0) {
                return `
                    <div class="bg-bg-base/70 border border-bg-border rounded-xl p-6 text-center text-xs text-slate-400">
                        現在このサーバーにログインしているプレイヤーは 0 人です。
                    </div>
                `;
            }

            if (data.playerList.length === 0) {
                return `
                    <div class="bg-bg-base/70 border border-bg-border rounded-xl p-4 flex items-start gap-3 text-xs">
                        <i class="fa-solid fa-eye-slash text-amber-400 text-base mt-0.5"></i>
                        <div class="space-y-1">
                            <p class="font-bold text-slate-200">現在 ${data.playersOnline.toLocaleString()} 人がオンラインですが、個別のプレイヤー名はサーバー側で非公開に設定されています</p>
                            <p class="text-slate-400">大規模ネットワークや <code class="font-mono text-slate-300">hide-online-players=true</code> 設定のサーバーでは、人数のみが公開されます。</p>
                        </div>
                    </div>
                `;
            }

            const filtered = data.playerList.filter(p =>
                p.name.toLowerCase().includes(playerSearchQuery.toLowerCase())
            );

            if (filtered.length === 0) {
                return `
                    <div class="bg-bg-base/70 border border-bg-border rounded-xl p-6 text-center text-xs text-slate-400">
                        「${escapeHTML(playerSearchQuery)}」に一致するプレイヤーが見つかりません。
                    </div>
                `;
            }

            const totalItems = filtered.length;
            const totalPages = Math.max(1, Math.ceil(totalItems / PLAYERS_PER_PAGE));
            if (currentPlayerPage > totalPages) currentPlayerPage = totalPages;
            if (currentPlayerPage < 1) currentPlayerPage = 1;

            const startIdx = (currentPlayerPage - 1) * PLAYERS_PER_PAGE;
            const endIdx = Math.min(startIdx + PLAYERS_PER_PAGE, totalItems);
            const pagePlayers = filtered.slice(startIdx, endIdx);

            const remainingServerHidden = data.playersOnline - data.playerList.length;

            // ページ番号ボタンの生成
            let paginationHtml = '';
            if (totalPages > 1) {
                const pageButtons = getPaginationRange(currentPlayerPage, totalPages).map(item => {
                    if (item === '...') {
                        return `<span class="px-2 py-1 text-xs text-slate-500">...</span>`;
                    }
                    const isCurrent = item === currentPlayerPage;
                    return `
                        <button type="button" onclick="changePlayerPage(${item})"
                            class="min-w-[32px] h-8 px-2 rounded-lg text-xs font-mono font-bold transition cursor-pointer ${
                                isCurrent
                                    ? 'bg-mc-emerald text-slate-950 shadow-sm'
                                    : 'bg-bg-base hover:bg-bg-elevated text-slate-300 border border-bg-border'
                            }">
                            ${item}
                        </button>
                    `;
                }).join('');

                paginationHtml = `
                    <div class="flex flex-wrap items-center justify-between gap-2 pt-3 border-t border-bg-border/60">
                        <div class="text-[11px] font-mono text-slate-400">
                            ${(startIdx + 1).toLocaleString()} - ${endIdx.toLocaleString()}人目を表示中（全 ${totalItems.toLocaleString()}人 / 1ページ50人）
                        </div>
                        <div class="flex items-center gap-1">
                            <button type="button" onclick="changePlayerPage(${currentPlayerPage - 1})" ${currentPlayerPage === 1 ? 'disabled' : ''}
                                class="px-2.5 h-8 rounded-lg text-xs font-bold bg-bg-base hover:bg-bg-elevated text-slate-300 border border-bg-border disabled:opacity-30 disabled:pointer-events-none cursor-pointer">
                                <i class="fa-solid fa-chevron-left mr-1"></i>前へ
                            </button>
                            ${pageButtons}
                            <button type="button" onclick="changePlayerPage(${currentPlayerPage + 1})" ${currentPlayerPage === totalPages ? 'disabled' : ''}
                                class="px-2.5 h-8 rounded-lg text-xs font-bold bg-bg-base hover:bg-bg-elevated text-slate-300 border border-bg-border disabled:opacity-30 disabled:pointer-events-none cursor-pointer">
                                次へ<i class="fa-solid fa-chevron-right ml-1"></i>
                            </button>
                        </div>
                    </div>
                `;
            } else {
                paginationHtml = `
                    <div class="flex items-center justify-between pt-2 text-[11px] font-mono text-slate-400">
                        <span>全 ${totalItems.toLocaleString()}人を表示中（1ページ最大50人）</span>
                        <span class="text-slate-500">Mojang公式テクスチャAPI描画</span>
                    </div>
                `;
            }

            return `
                <div class="space-y-3">
                    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-2">
                        ${pagePlayers.map(player => {
                            const safeName = escapeHTML(player.name);
                            const safeUuid = escapeAttr(player.uuid || '');
                            const safeNameAttr = escapeAttr(player.name);
                            const isBedrockUser = player.platform === 'bedrock' || player.name.startsWith('.');
                            return `
                                <div onclick="copyText('${safeNameAttr}')" title="クリックでMCIDをコピー${player.uuid ? ' (UUID: ' + player.uuid + ')' : ''}"
                                    class="flex items-center gap-2.5 p-2 rounded-xl bg-bg-base hover:bg-bg-elevated border border-bg-border hover:border-mc-emerald/50 transition cursor-pointer group">
                                    <canvas data-mc-head="true" data-username="${safeNameAttr}" data-uuid="${safeUuid}" data-bedrock="${isBedrockUser}"
                                        width="32" height="32"
                                        class="w-7 h-7 rounded-md bg-bg-elevated pixelated shrink-0 border border-bg-border/50"></canvas>
                                    <div class="min-w-0 flex-1">
                                        <div class="text-xs font-mono font-semibold text-slate-200 group-hover:text-white truncate">
                                            ${safeName}
                                        </div>
                                        ${isBedrockUser ? `<div class="text-[9px] font-mono text-sky-400 leading-none mt-0.5">BE</div>` : ''}
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>

                    ${paginationHtml}

                    ${remainingServerHidden > 0 ? `
                        <p class="text-[11px] text-amber-400/90 bg-amber-950/20 border border-amber-900/30 rounded-lg px-3 py-2">
                            <i class="fa-solid fa-circle-info mr-1"></i>
                            サーバー本体が外部応答（SLPサンプル）で返すプレイヤー名の上限仕様により、他 ${remainingServerHidden.toLocaleString()} 人の個別名はサーバーから送信されていません。取得できた全員（${data.playerList.length}名）をすべて表示しています。
                        </p>
                    ` : ''}
                </div>
            `;
        }

        function getPaginationRange(current, total) {
            if (total <= 7) {
                return Array.from({ length: total }, (_, i) => i + 1);
            }
            if (current <= 4) {
                return [1, 2, 3, 4, 5, '...', total];
            }
            if (current >= total - 3) {
                return [1, '...', total - 4, total - 3, total - 2, total - 1, total];
            }
            return [1, '...', current - 1, current, current + 1, '...', total];
        }

        /**
         * 検索入力時：input要素を再描画せず、プレイヤーリスト部分だけを更新する（フォーカス維持）
         */
        function handlePlayerSearch(val) {
            playerSearchQuery = val;
            currentPlayerPage = 1;

            const clearBtn = document.getElementById('player-search-clear');
            if (clearBtn) {
                clearBtn.classList.toggle('hidden', !val);
            }

            updatePlayersAreaOnly();
        }

        function clearPlayerSearch() {
            const input = document.getElementById('player-search-input');
            if (input) {
                input.value = '';
                input.focus();
            }
            handlePlayerSearch('');
        }

        function changePlayerPage(page) {
            currentPlayerPage = page;
            updatePlayersAreaOnly();
            const area = document.getElementById('players-list-area');
            if (area) {
                area.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
        }

        function updatePlayersAreaOnly() {
            const srv = savedServers.find(s => s.id === selectedServerId);
            if (!srv) return;
            const state = statusCache[srv.id];
            if (!state || !state.data) return;

            const area = document.getElementById('players-list-area');
            if (area) {
                area.innerHTML = buildPlayersAreaHTML(state.data);
                hydrateOfficialPlayerHeads();
            }
        }

        // ==========================================
        // Mojang公式API (SessionServer) からスキンPNGを取得しCanvasに顔(8x8+帽子)を描画
        // ==========================================
        async function hydrateOfficialPlayerHeads() {
            const canvases = document.querySelectorAll('canvas[data-mc-head="true"]');
            canvases.forEach(canvas => {
                drawMojangOfficialHead(canvas);
            });
        }

        async function drawMojangOfficialHead(canvas) {
            const username = canvas.dataset.username;
            const uuid = canvas.dataset.uuid;
            const isBedrock = canvas.dataset.bedrock === 'true';
            const ctx = canvas.getContext('2d');
            ctx.imageSmoothingEnabled = false;

            // まずデフォルトのSteve風ピクセル顔を仮描画
            drawDefaultSteveCanvas(ctx);

            if (!username || isBedrock) {
                // 統合版プレイヤーはMojang Java公式UUIDを持たないためフォールバック取得
                loadFallbackAvatarToCanvas(ctx, username);
                return;
            }

            try {
                const skinTextureUrl = await resolveOfficialMojangSkinUrl(username, uuid);
                if (skinTextureUrl) {
                    const loaded = await renderSkinPngHeadToCanvas(ctx, skinTextureUrl);
                    if (loaded) return;
                }
            } catch (e) {
                // CORSやレート制限時はフォールバックへ
            }

            loadFallbackAvatarToCanvas(ctx, uuid || username);
        }

        /**
         * Mojang公式API (api.mojang.com -> sessionserver.mojang.com) から公式スキンPNGのURLを解決
         */
        async function resolveOfficialMojangSkinUrl(username, providedUuid) {
            const cacheKey = (providedUuid || username).toLowerCase();
            if (officialSkinCache.has(cacheKey)) {
                return officialSkinCache.get(cacheKey);
            }

            let cleanUuid = providedUuid ? providedUuid.replace(/-/g, '') : null;

            // UUIDが未取得の場合はMojang公式ユーザー名解決APIを使用
            if (!cleanUuid) {
                const profileRes = await fetchJsonWithCorsFallback(
                    `https://api.mojang.com/users/profiles/minecraft/${encodeURIComponent(username)}`
                );
                if (profileRes && profileRes.id) {
                    cleanUuid = profileRes.id.replace(/-/g, '');
                }
            }

            if (!cleanUuid) {
                officialSkinCache.set(cacheKey, null);
                return null;
            }

            // Mojang公式 SessionServer API から Base64 テクスチャペイロードを取得
            const sessionRes = await fetchJsonWithCorsFallback(
                `https://sessionserver.mojang.com/session/minecraft/profile/${cleanUuid}`
            );

            if (sessionRes && Array.isArray(sessionRes.properties)) {
                const texProp = sessionRes.properties.find(p => p.name === 'textures');
                if (texProp && texProp.value) {
                    const decodedJson = JSON.parse(atob(texProp.value));
                    const skinUrl = decodedJson?.textures?.SKIN?.url || null;
                    if (skinUrl) {
                        // https化
                        const secureUrl = skinUrl.replace(/^http:\/\//i, 'https://');
                        officialSkinCache.set(cacheKey, secureUrl);
                        return secureUrl;
                    }
                }
            }

            officialSkinCache.set(cacheKey, null);
            return null;
        }

        /**
         * Mojang公式APIに直接アクセスし、ブラウザCORS制限がかかった場合のみCORS中継経由で公式APIを取得
         */
        async function fetchJsonWithCorsFallback(targetUrl) {
            try {
                const direct = await fetch(targetUrl);
                if (direct.ok) return await direct.json();
            } catch (e) {
                // ブラウザのCORS制限時は中継経由でMojang公式APIのJSONを取得
            }

            try {
                const proxied = await fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`);
                if (proxied.ok) return await proxied.json();
            } catch (e) {}

            return null;
        }

        /**
         * 公式 textures.minecraft.net の64x64スキンPNGから顔(8,8,8,8)と帽子レイヤー(40,8,8,8)を切り出して描画
         */
        function renderSkinPngHeadToCanvas(ctx, skinUrl) {
            return new Promise((resolve) => {
                const img = new Image();
                img.crossOrigin = 'Anonymous';
                img.onload = () => {
                    try {
                        ctx.clearRect(0, 0, 32, 32);
                        ctx.imageSmoothingEnabled = false;
                        // 1層目: 顔ベース (x:8, y:8, w:8, h:8)
                        ctx.drawImage(img, 8, 8, 8, 8, 0, 0, 32, 32);
                        // 2層目: ヘルメット・帽子レイヤー (x:40, y:8, w:8, h:8)
                        ctx.drawImage(img, 40, 8, 8, 8, 0, 0, 32, 32);
                        resolve(true);
                    } catch (err) {
                        resolve(false);
                    }
                };
                img.onerror = () => resolve(false);
                img.src = skinUrl;
            });
        }

        function loadFallbackAvatarToCanvas(ctx, identifier) {
            if (!identifier) return;
            const img = new Image();
            img.crossOrigin = 'Anonymous';
            img.onload = () => {
                ctx.clearRect(0, 0, 32, 32);
                ctx.imageSmoothingEnabled = false;
                ctx.drawImage(img, 0, 0, 32, 32);
            };
            img.src = `https://mc-heads.net/avatar/${encodeURIComponent(identifier)}/32`;
        }

        function drawDefaultSteveCanvas(ctx) {
            ctx.fillStyle = '#b58d72';
            ctx.fillRect(0, 0, 32, 32);
            // 髪
            ctx.fillStyle = '#3b271a';
            ctx.fillRect(0, 0, 32, 8);
            ctx.fillRect(0, 8, 4, 4);
            ctx.fillRect(28, 8, 4, 4);
            // 目
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(4, 16, 4, 4);
            ctx.fillRect(24, 16, 4, 4);
            ctx.fillStyle = '#493896';
            ctx.fillRect(8, 16, 4, 4);
            ctx.fillRect(20, 16, 4, 4);
            // 鼻・口
            ctx.fillStyle = '#8c6249';
            ctx.fillRect(12, 20, 8, 4);
            ctx.fillStyle = '#5e3726';
            ctx.fillRect(8, 24, 16, 4);
        }

        function toggleAutoRefresh() {
            autoRefreshEnabled = !autoRefreshEnabled;
            if (autoRefreshTimer) {
                clearInterval(autoRefreshTimer);
                autoRefreshTimer = null;
            }
            if (autoRefreshEnabled) {
                autoRefreshTimer = setInterval(() => {
                    const srv = savedServers.find(s => s.id === selectedServerId);
                    if (srv) fetchServerStatus(srv);
                }, 30000);
                showToast('30秒ごとの自動更新を有効にしました');
            } else {
                showToast('自動更新をオフにしました');
            }
            renderDetailPanel();
        }

        // ==========================================
        // ユーティリティ関数
        // ==========================================
        function escapeHTML(str) {
            return String(str ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function escapeAttr(str) {
            return String(str ?? '').replace(/'/g, "\\'").replace(/"/g, '&quot;');
        }

        function copyText(text) {
            if (!text) return;
            const input = document.createElement('input');
            input.value = text;
            document.body.appendChild(input);
            input.select();
            document.execCommand('copy');
            document.body.removeChild(input);
            showToast(`「${text}」をコピーしました`);
        }

        function showToast(message) {
            const container = document.getElementById('toast-container');
            const el = document.createElement('div');
            el.className = 'toast-anim pointer-events-auto flex items-center gap-2 px-4 py-2.5 rounded-xl bg-bg-elevated border border-mc-emerald/50 text-white text-xs font-bold shadow-2xl';
            el.innerHTML = `<i class="fa-solid fa-circle-check text-mc-emerald"></i><span>${escapeHTML(message)}</span>`;
            container.appendChild(el);

            setTimeout(() => {
                el.style.opacity = '0';
                el.style.transition = 'opacity 0.2s ease';
                setTimeout(() => el.remove(), 220);
            }, 2800);
        }

        // ==========================================
        // 起動時初期化
        // ==========================================
        window.addEventListener('DOMContentLoaded', () => {
            restoreServers();
            renderServerList();
            renderDetailPanel();

            // 保存されている全サーバーのリアルタイムステータスを取得
            savedServers.forEach(srv => fetchServerStatus(srv));
        });
    </script>
</body>
