<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MC Live Monitor - マイクラ リアルタイムサーバーステータス</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter, Noto Sans JP, JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Inter"', '"Noto Sans JP"', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace'],
                    },
                    colors: {
                        bg: {
                            base: 'var(--bg-base)',
                            surface: 'var(--bg-surface)',
                            elevated: 'var(--bg-elevated)',
                            border: 'var(--bg-border)',
                        },
                        mc: {
                            emerald: '#10b981',
                            crimson: '#ef4444',
                            gold: '#f59e0b',
                            diamond: '#0ea5e9',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --bg-base: #f4f6f8;
            --bg-surface: #ffffff;
            --bg-elevated: #eef1f5;
            --bg-border: #d8dee4;
            --text-main: #1f2328;
            --text-muted: #59636e;
        }
        html.dark {
            --bg-base: #0d1117;
            --bg-surface: #161b22;
            --bg-elevated: #21262d;
            --bg-border: #30363d;
            --text-main: #e6edf3;
            --text-muted: #8b949e;
        }
        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            transition: background-color 0.15s ease, color 0.15s ease;
        }
        .text-main {
            color: var(--text-main);
        }
        .text-muted {
            color: var(--text-muted);
        }
        .pixelated {
            image-rendering: pixelated;
        }
        /* マイクラゲーム内チャット風MOTDボックス（ゲーム内視認性のため常に暗色背景を維持） */
        .mc-motd-box {
            background-color: #111318;
            font-family: 'JetBrains Mono', 'Noto Sans JP', monospace;
            text-shadow: 1.5px 1.5px 0px rgba(0, 0, 0, 0.9);
            line-height: 1.55;
            color: #e6edf3;
        }
        /* カスタムスクロールバー */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--bg-border);
            border-radius: 9999px;
        }
        @keyframes toastSlide {
            from { transform: translateY(12px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .toast-anim {
            animation: toastSlide 0.18s ease-out forwards;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col antialiased selection:bg-mc-emerald selection:text-slate-950">

    <!-- トップナビゲーションバー -->
    <header class="sticky top-0 z-40 bg-bg-surface border-b border-bg-border">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3 flex flex-wrap items-center justify-between gap-3">
            <div class="flex items-center gap-2.5">
                <div class="w-8 h-8 rounded-lg bg-mc-emerald/15 border border-mc-emerald/30 flex items-center justify-center shrink-0">
                    <i class="fa-solid fa-server text-mc-emerald text-sm"></i>
                </div>
                <div class="flex items-baseline gap-2.5">
                    <h1 class="text-base sm:text-lg font-bold tracking-tight text-main">Minecraft Server Status</h1>
                    <span class="hidden sm:inline text-xs text-muted">サーバーステータス・参加者モニター</span>
                </div>
            </div>

            <!-- 右側コントロール -->
            <div class="flex items-center gap-2">
                <span id="cookie-status-text" class="hidden md:inline-block text-[11px] font-mono px-2.5 py-1 rounded-md bg-bg-elevated border border-bg-border text-muted" title="登録サーバーのアドレス情報のみCookieに保存されます">
                    Cookie同期中
                </span>

                <!-- ダークモード / ライトモード切替ボタン -->
                <button onclick="toggleTheme()" id="theme-toggle-btn"
                    class="text-xs font-medium px-3 py-1.5 rounded-lg bg-bg-elevated hover:opacity-85 text-main border border-bg-border transition flex items-center gap-1.5 cursor-pointer"
                    title="ライトモード / ダークモード切り替え">
                    <i class="fa-solid fa-sun text-amber-400" id="theme-icon"></i>
                    <span id="theme-label">ライト</span>
                </button>

                <button onclick="refreshAllServers()" id="refresh-all-btn"
                    class="text-xs font-semibold px-3 py-1.5 rounded-lg bg-bg-elevated hover:opacity-85 text-main border border-bg-border transition flex items-center gap-1.5 cursor-pointer">
                    <i class="fa-solid fa-arrows-rotate" id="refresh-all-icon"></i>
                    <span>全更新</span>
                </button>
            </div>
        </div>
    </header>

    <!-- メインコンテンツ (2カラム: 左にサーバー一覧、右に詳細ビュー) -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 py-5 grid grid-cols-1 lg:grid-cols-12 gap-5 items-start">

        <!-- 左カラム: サーバー追加フォーム & 登録済みサーバーリスト (5カラム) -->
        <div class="lg:col-span-5 space-y-4">

            <!-- サーバー追加カード -->
            <section class="bg-bg-surface border border-bg-border rounded-xl p-4 space-y-3">
                <div class="flex items-center justify-between">
                    <h2 class="text-xs font-bold uppercase tracking-wider text-muted">サーバー登録</h2>
                    <span class="text-[11px] font-mono text-muted">例: mc.hypixel.net / :25565</span>
                </div>

                <form onsubmit="handleAddServer(event)" class="space-y-2">
                    <div class="flex flex-col sm:flex-row gap-2">
                        <input type="text" id="add-address-input" required
                            placeholder="サーバーアドレスを入力 (Java / 統合版 自動判定)"
                            class="flex-1 bg-bg-base border border-bg-border focus:border-mc-emerald rounded-lg px-3 py-2 text-sm font-mono text-main placeholder-slate-400 outline-none transition">
                    </div>
                    <div class="flex gap-2">
                        <input type="text" id="add-label-input"
                            placeholder="表示名（省略可）"
                            class="flex-1 bg-bg-base border border-bg-border focus:border-mc-emerald rounded-lg px-3 py-1.5 text-xs text-main placeholder-slate-400 outline-none transition">
                        <button type="submit"
                            class="px-4 py-1.5 rounded-lg bg-mc-emerald hover:bg-emerald-600 text-white font-bold text-xs transition shrink-0 flex items-center gap-1.5 cursor-pointer">
                            <i class="fa-solid fa-plus"></i>
                            <span>追加</span>
                        </button>
                    </div>
                </form>

                <!-- テスト用サーバープリセット -->
                <div class="pt-2 border-t border-bg-border flex flex-wrap items-center gap-1.5">
                    <span class="text-[11px] text-muted mr-1">テスト追加:</span>
                    <button type="button" onclick="quickAddPreset('mc.hypixel.net', 'Hypixel')" class="text-[11px] font-mono px-2 py-0.5 rounded bg-bg-elevated hover:opacity-80 text-main border border-bg-border transition cursor-pointer">
                        mc.hypixel.net
                    </button>
                    <button type="button" onclick="quickAddPreset('play.cubecraft.net', 'CubeCraft')" class="text-[11px] font-mono px-2 py-0.5 rounded bg-bg-elevated hover:opacity-80 text-main border border-bg-border transition cursor-pointer">
                        play.cubecraft.net
                    </button>
                    <button type="button" onclick="quickAddPreset('2b2t.org', '2b2t')" class="text-[11px] font-mono px-2 py-0.5 rounded bg-bg-elevated hover:opacity-80 text-main border border-bg-border transition cursor-pointer">
                        2b2t.org
                    </button>
                    <button type="button" onclick="quickAddPreset('play.inpvp.net', 'Mineville')" class="text-[11px] font-mono px-2 py-0.5 rounded bg-bg-elevated hover:opacity-80 text-main border border-bg-border transition cursor-pointer">
                        play.inpvp.net
                    </button>
                </div>
            </section>

            <!-- 登録済みサーバーリスト -->
            <section class="space-y-2">
                <div class="flex items-center justify-between px-1">
                    <h3 class="text-xs font-bold uppercase tracking-wider text-muted flex items-center gap-1.5">
                        <span>登録サーバー</span>
                        <span id="server-count-badge" class="px-1.5 py-0.2 rounded bg-bg-elevated text-main font-mono text-[11px]">0</span>
                    </h3>
                    <span class="text-[11px] text-muted">選択して詳細表示</span>
                </div>

                <div id="server-list-container" class="space-y-2">
                    <!-- JSでサーバーカードをレンダリング -->
                </div>
            </section>
        </div>

        <!-- 右カラム: 選択されたサーバーのリアルタイム詳細ビュー (7カラム) -->
        <div class="lg:col-span-7" id="detail-panel-wrapper">
            <!-- JSで詳細パネルをレンダリング -->
        </div>

    </main>

    <!-- 削除確認モーダル -->
    <div id="delete-modal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-xs hidden items-center justify-center p-4">
        <div class="bg-bg-surface border border-bg-border rounded-xl max-w-sm w-full p-5 space-y-4 shadow-xl">
            <div class="space-y-1">
                <h4 class="font-bold text-main text-sm">サーバーを削除しますか？</h4>
                <p id="delete-modal-target" class="text-xs font-mono text-muted break-all"></p>
            </div>
            <div class="flex justify-end gap-2">
                <button onclick="closeDeleteModal()" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-bg-elevated text-main border border-bg-border hover:opacity-85 cursor-pointer">キャンセル</button>
                <button onclick="confirmDeleteServer()" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-red-600 text-white hover:bg-red-500 cursor-pointer">削除</button>
            </div>
        </div>
    </div>

    <!-- トースト通知エリア -->
    <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <script>
        // ==========================================
        // テーマ（ダークモード / ライトモード）管理
        // ==========================================
        const THEME_KEY = 'mc_monitor_theme';

        function initTheme() {
            let savedTheme = null;
            try {
                savedTheme = localStorage.getItem(THEME_KEY);
            } catch (e) {}

            const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            const isDark = savedTheme ? savedTheme === 'dark' : prefersDark;
            applyTheme(isDark);
        }

        function applyTheme(isDark) {
            const html = document.documentElement;
            const icon = document.getElementById('theme-icon');
            const label = document.getElementById('theme-label');

            if (isDark) {
                html.classList.add('dark');
                if (icon) icon.className = 'fa-solid fa-sun text-amber-400';
                if (label) label.textContent = 'ライト';
            } else {
                html.classList.remove('dark');
                if (icon) icon.className = 'fa-solid fa-moon text-slate-600';
                if (label) label.textContent = 'ダーク';
            }
        }

        function toggleTheme() {
            const isCurrentlyDark = document.documentElement.classList.contains('dark');
            const nextDark = !isCurrentlyDark;
            applyTheme(nextDark);
            try {
                localStorage.setItem(THEME_KEY, nextDark ? 'dark' : 'light');
            } catch (e) {}
        }

        // ==========================================
        // フォールバック用 デフォルト草ブロックSVGアイコン & プレイヤー頭SVG
        // ==========================================
        const DEFAULT_ICON_SVG = "data:image/svg+xml;utf8," + encodeURIComponent(`
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
                <rect width="64" height="64" fill="#4e342e"/>
                <rect width="64" height="18" fill="#10b981"/>
                <rect x="0" y="18" width="10" height="6" fill="#10b981"/>
                <rect x="18" y="18" width="12" height="8" fill="#10b981"/>
                <rect x="40" y="18" width="8" height="6" fill="#10b981"/>
                <rect x="54" y="18" width="10" height="7" fill="#10b981"/>
                <rect x="12" y="34" width="8" height="6" fill="#3e2723"/>
                <rect x="42" y="44" width="8" height="6" fill="#3e2723"/>
            </svg>
        `);

        const DEFAULT_STEVE_HEAD_SVG = "data:image/svg+xml;utf8," + encodeURIComponent(`
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 8 8" width="32" height="32" shape-rendering="crispEdges">
                <rect width="8" height="8" fill="#b58d72"/>
                <rect width="8" height="2" fill="#3b271a"/>
                <rect x="0" y="2" width="1" height="1" fill="#3b271a"/>
                <rect x="7" y="2" width="1" height="1" fill="#3b271a"/>
                <rect x="1" y="4" width="1" height="1" fill="#ffffff"/>
                <rect x="2" y="4" width="1" height="1" fill="#493896"/>
                <rect x="5" y="4" width="1" height="1" fill="#493896"/>
                <rect x="6" y="4" width="1" height="1" fill="#ffffff"/>
                <rect x="3" y="5" width="2" height="1" fill="#8c6249"/>
                <rect x="2" y="6" width="4" height="1" fill="#5e3726"/>
            </svg>
        `);

        // ==========================================
        // Cookie & LocalStorage 永続化管理
        // ==========================================
        const COOKIE_KEY = 'mc_live_servers_v2';
        const STORAGE_KEY = 'mc_live_servers_backup_v2';

        function writeCookie(name, value, maxAgeSec = 31536000) {
            try {
                document.cookie = `${name}=${encodeURIComponent(value)}; max-age=${maxAgeSec}; path=/; SameSite=Lax`;
            } catch (e) {
                console.warn('Cookie書き込み失敗:', e);
            }
        }

        function readCookie(name) {
            try {
                const pairs = document.cookie ? document.cookie.split('; ') : [];
                for (const pair of pairs) {
                    const idx = pair.indexOf('=');
                    if (idx === -1) continue;
                    const k = pair.slice(0, idx);
                    if (k === name) {
                        return decodeURIComponent(pair.slice(idx + 1));
                    }
                }
            } catch (e) {
                console.warn('Cookie読み込み失敗:', e);
            }
            return null;
        }

        // ==========================================
        // アプリケーション状態
        // ==========================================
        let savedServers = [];      // { id, address, label } ※Cookieにはアドレス情報のみ保存
        let statusCache = {};       // { [id]: { loading, error, data, fetchedAt } }
        let selectedServerId = null;
        let playerSearchQuery = '';
        let currentPlayerPage = 1;
        const PLAYERS_PER_PAGE = 50;
        let autoRefreshEnabled = false;
        let autoRefreshTimer = null;
        let pendingDeleteId = null;

        /**
         * サーバー登録リスト（アドレス情報のみ）をCookieに保存
         */
        function persistServers() {
            const minimalList = savedServers.map(s => ({
                id: s.id,
                address: s.address,
                label: s.label || ''
            }));
            const serialized = JSON.stringify(minimalList);
            writeCookie(COOKIE_KEY, serialized, 31536000);
            try {
                localStorage.setItem(STORAGE_KEY, serialized);
            } catch (e) {}

            const badge = document.getElementById('cookie-status-text');
            if (badge) {
                const now = new Date();
                badge.textContent = `Cookie保存済 (${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')})`;
            }
        }

        /**
         * Cookie（またはバックアップ）から登録サーバーを復元
         */
        function restoreServers() {
            let raw = readCookie(COOKIE_KEY);
            if (!raw) {
                try {
                    raw = localStorage.getItem(STORAGE_KEY);
                } catch (e) {}
            }

            if (raw) {
                try {
                    const parsed = JSON.parse(raw);
                    if (Array.isArray(parsed)) {
                        savedServers = parsed.map(item => ({
                            id: item.id,
                            address: item.address,
                            label: item.label || ''
                        }));
                    }
                } catch (e) {
                    console.error('保存データのパースに失敗:', e);
                }
            }

            // 初回起動時（Cookieが空のとき）は代表的な実在サーバーを1件だけ初期登録しておく
            if (savedServers.length === 0) {
                savedServers = [
                    {
                        id: 'srv_init_1',
                        address: 'mc.hypixel.net',
                        label: 'Hypixel'
                    }
                ];
                persistServers();
            }

            if (savedServers.length > 0 && !selectedServerId) {
                selectedServerId = savedServers[0].id;
            }
        }

        // ==========================================
        // 実マイクラサーバーAPI通信処理 (Java / Bedrock 自動判定)
        // ==========================================
        async function fetchSingleEditionEndpoint(address, edition) {
            const startTime = performance.now();
            const encodedAddr = encodeURIComponent(address.trim());
            const isBedrock = edition === 'bedrock';
            const cacheBuster = `_t=${Date.now()}`;

            const primaryUrl = isBedrock
                ? `https://api.mcsrvstat.us/bedrock/3/${encodedAddr}?${cacheBuster}`
                : `https://api.mcsrvstat.us/3/${encodedAddr}?${cacheBuster}`;

            const fallbackUrl = isBedrock
                ? `https://api.mcstatus.io/v2/status/bedrock/${encodedAddr}?${cacheBuster}`
                : `https://api.mcstatus.io/v2/status/java/${encodedAddr}?${cacheBuster}`;

            // 両APIから並列取得して、より多くのプレイヤーリストや詳細情報を補完
            const [res1, res2] = await Promise.allSettled([
                fetch(primaryUrl, { cache: 'no-store' }).then(async r => {
                    if (!r.ok) throw new Error(`HTTP ${r.status}`);
                    const json = await r.json();
                    return normalizeMcsrvstatData(json, { address, edition }, Math.round(performance.now() - startTime));
                }),
                fetch(fallbackUrl, { cache: 'no-store' }).then(async r => {
                    if (!r.ok) throw new Error(`HTTP ${r.status}`);
                    const json = await r.json();
                    return normalizeMcstatusIoData(json, { address, edition }, Math.round(performance.now() - startTime));
                })
            ]);

            const d1 = res1.status === 'fulfilled' ? res1.value : null;
            const d2 = res2.status === 'fulfilled' ? res2.value : null;

            if (!d1 && !d2) {
                throw new Error('Both status APIs failed');
            }

            const base = (d1 && d1.online) ? d1 : ((d2 && d2.online) ? d2 : (d1 || d2));
            const secondary = base === d1 ? d2 : d1;

            // 両方のAPIから返されたプレイヤーリストを重複排除して統合
            const mergedMap = new Map();
            const addPlayers = (list, sourceEdition) => {
                if (!Array.isArray(list)) return;
                for (const p of list) {
                    const key = p.name.toLowerCase();
                    if (!mergedMap.has(key)) {
                        mergedMap.set(key, { ...p, platform: sourceEdition });
                    } else if (!mergedMap.get(key).uuid && p.uuid) {
                        mergedMap.get(key).uuid = p.uuid;
                    }
                }
            };
            addPlayers(base?.playerList, edition);
            addPlayers(secondary?.playerList, edition);

            return {
                ...base,
                playerList: Array.from(mergedMap.values()),
                detectedTps: base.detectedTps ?? secondary?.detectedTps ?? null,
                plugins: base.plugins.length > 0 ? base.plugins : (secondary?.plugins || []),
                mods: base.mods.length > 0 ? base.mods : (secondary?.mods || [])
            };
        }

        async function fetchServerStatus(server, notifyOnUpdate = false) {
            if (!server) return;
            const id = server.id;
            const prevData = statusCache[id]?.data || null;

            statusCache[id] = {
                ...(statusCache[id] || {}),
                loading: true,
                error: null
            };
            renderServerList();
            if (selectedServerId === id) {
                const spinIcon = document.getElementById('detail-refresh-icon');
                if (spinIcon) spinIcon.classList.add('animate-spin');
            }

            try {
                // 常にJava版と統合版(Bedrock)の両方を同時チェックして対応エディションを自動判定
                const [javaRes, bedrockRes] = await Promise.allSettled([
                    fetchSingleEditionEndpoint(server.address, 'java'),
                    fetchSingleEditionEndpoint(server.address, 'bedrock')
                ]);

                const jData = javaRes.status === 'fulfilled' ? javaRes.value : null;
                const bData = bedrockRes.status === 'fulfilled' ? bedrockRes.value : null;

                if (!jData && !bData) {
                    throw new Error('Java/Bedrock両方の取得に失敗しました');
                }

                const jOnline = Boolean(jData?.online);
                const bOnline = Boolean(bData?.online);
                const anyOnline = jOnline || bOnline;

                // 自動判定されたエディション種別
                let detectedEdition = 'unknown';
                if (jOnline && bOnline) {
                    detectedEdition = 'multi';
                } else if (jOnline) {
                    detectedEdition = 'java';
                } else if (bOnline) {
                    detectedEdition = 'bedrock';
                }

                const primary = jOnline ? jData : (bOnline ? bData : (jData || bData));

                // JavaとBedrockのプレイヤーリストを統合（重複除外）
                const playerMap = new Map();
                if (jOnline && jData?.playerList) {
                    jData.playerList.forEach(p => playerMap.set(p.name.toLowerCase(), { ...p, platform: 'java' }));
                }
                if (bOnline && bData?.playerList) {
                    bData.playerList.forEach(p => {
                        const key = p.name.toLowerCase();
                        if (!playerMap.has(key)) {
                            playerMap.set(key, { ...p, platform: 'bedrock' });
                        }
                    });
                }

                const totalOnline = jOnline && bOnline
                    ? Math.max(jData?.playersOnline || 0, bData?.playersOnline || 0)
                    : (jOnline ? (jData?.playersOnline || 0) : (bOnline ? (bData?.playersOnline || 0) : 0));

                const totalMax = jOnline && bOnline
                    ? Math.max(jData?.playersMax || 0, bData?.playersMax || 0)
                    : (jOnline ? (jData?.playersMax || 0) : (bOnline ? (bData?.playersMax || 0) : 0));

                const normalizedData = {
                    ...primary,
                    online: anyOnline,
                    detectedEdition,
                    isMulti: detectedEdition === 'multi',
                    multiDetails: {
                        java: jData,
                        bedrock: bData
                    },
                    version: detectedEdition === 'multi'
                        ? [jOnline ? `JE: ${jData.version}` : null, bOnline ? `BE: ${bData.version}` : null].filter(Boolean).join(' / ')
                        : primary.version,
                    playersOnline: totalOnline,
                    playersMax: totalMax,
                    playerList: Array.from(playerMap.values()),
                    pingMs: jOnline && bOnline
                        ? Math.round((jData.pingMs + bData.pingMs) / 2)
                        : primary.pingMs,
                    detectedTps: jData?.detectedTps ?? bData?.detectedTps ?? null
                };

                statusCache[id] = {
                    loading: false,
                    error: null,
                    data: normalizedData,
                    fetchedAt: new Date()
                };

                if (notifyOnUpdate && prevData && prevData.playersOnline !== normalizedData.playersOnline) {
                    const diff = normalizedData.playersOnline - prevData.playersOnline;
                    const sign = diff > 0 ? `+${diff}` : `${diff}`;
                    showToast(`${server.label || server.address}: 参加人数が更新されました (${normalizedData.playersOnline}人 / ${sign})`);
                }
            } catch (err) {
                statusCache[id] = {
                    loading: false,
                    error: 'サーバーへの接続またはAPI取得に失敗しました。アドレスとポートを確認してください。',
                    data: null,
                    fetchedAt: new Date()
                };
            }

            // ユーザー増減やステータス変化を確実に反映するためリストと詳細全体を再描画
            renderServerList();
            if (selectedServerId === id) {
                const activeEl = document.activeElement;
                const isSearching = activeEl && activeEl.id === 'player-search-input';
                const selectionStart = isSearching ? activeEl.selectionStart : null;
                const selectionEnd = isSearching ? activeEl.selectionEnd : null;

                renderDetailPanel();

                if (isSearching) {
                    const restoredInput = document.getElementById('player-search-input');
                    if (restoredInput) {
                        restoredInput.focus();
                        if (selectionStart !== null && selectionEnd !== null) {
                            restoredInput.setSelectionRange(selectionStart, selectionEnd);
                        }
                    }
                }
            }
        }

        /**
         * Cookie（またはバックアップ）から登録サーバーを復元
         */
        function restoreServers() {
            let raw = readCookie(COOKIE_KEY);
            if (!raw) {
                try {
                    raw = localStorage.getItem(STORAGE_KEY);
                } catch (e) {}
            }

            if (raw) {
                try {
                    const parsed = JSON.parse(raw);
                    if (Array.isArray(parsed)) {
                        savedServers = parsed;
                    }
                } catch (e) {
                    console.error('保存データのパースに失敗:', e);
                }
            }

            // 初回起動時（Cookieが空のとき）は代表的な実在サーバーを1件だけ初期登録しておく
            if (savedServers.length === 0) {
                savedServers = [
                    {
                        id: 'srv_init_1',
                        address: 'mc.hypixel.net',
                        edition: 'java',
                        label: 'Hypixel'
                    }
                ];
                persistServers();
            }

            if (savedServers.length > 0 && !selectedServerId) {
                selectedServerId = savedServers[0].id;
            }
        }

        // ==========================================
        // 実マイクラサーバーAPI通信処理 (Java / Bedrock / Multi対応)
        // ==========================================
        async function fetchSingleEditionEndpoint(address, edition) {
            const startTime = performance.now();
            const encodedAddr = encodeURIComponent(address.trim());
            const isBedrock = edition === 'bedrock';

            const primaryUrl = isBedrock
                ? `https://api.mcsrvstat.us/bedrock/3/${encodedAddr}`
                : `https://api.mcsrvstat.us/3/${encodedAddr}`;

            const fallbackUrl = isBedrock
                ? `https://api.mcstatus.io/v2/status/bedrock/${encodedAddr}`
                : `https://api.mcstatus.io/v2/status/java/${encodedAddr}`;

            // 両APIから並列取得して、より多くのプレイヤーリストや詳細情報を補完
            const [res1, res2] = await Promise.allSettled([
                fetch(primaryUrl, { cache: 'no-store' }).then(async r => {
                    if (!r.ok) throw new Error(`HTTP ${r.status}`);
                    const json = await r.json();
                    return normalizeMcsrvstatData(json, { address, edition }, Math.round(performance.now() - startTime));
                }),
                fetch(fallbackUrl, { cache: 'no-store' }).then(async r => {
                    if (!r.ok) throw new Error(`HTTP ${r.status}`);
                    const json = await r.json();
                    return normalizeMcstatusIoData(json, { address, edition }, Math.round(performance.now() - startTime));
                })
            ]);

            const d1 = res1.status === 'fulfilled' ? res1.value : null;
            const d2 = res2.status === 'fulfilled' ? res2.value : null;

            if (!d1 && !d2) {
                throw new Error('Both status APIs failed');
            }

            const base = (d1 && d1.online) ? d1 : ((d2 && d2.online) ? d2 : (d1 || d2));
            const secondary = base === d1 ? d2 : d1;

            // 両方のAPIから返されたプレイヤーリストを重複排除して統合
            const mergedMap = new Map();
            const addPlayers = (list, sourceEdition) => {
                if (!Array.isArray(list)) return;
                for (const p of list) {
                    const key = p.name.toLowerCase();
                    if (!mergedMap.has(key)) {
                        mergedMap.set(key, { ...p, platform: sourceEdition });
                    } else if (!mergedMap.get(key).uuid && p.uuid) {
                        mergedMap.get(key).uuid = p.uuid;
                    }
                }
            };
            addPlayers(base?.playerList, edition);
            addPlayers(secondary?.playerList, edition);

            return {
                ...base,
                playerList: Array.from(mergedMap.values()),
                detectedTps: base.detectedTps ?? secondary?.detectedTps ?? null,
                plugins: base.plugins.length > 0 ? base.plugins : (secondary?.plugins || []),
                mods: base.mods.length > 0 ? base.mods : (secondary?.mods || [])
            };
        }

        async function fetchServerStatus(server) {
            const id = server.id;
            statusCache[id] = {
                ...(statusCache[id] || {}),
                loading: true,
                error: null
            };
            renderServerList();
            if (selectedServerId === id) renderDetailPanel();

            try {
                let normalizedData = null;

                if (server.edition === 'multi') {
                    // マルチプレイ（Java版 + 統合版 両対応）の場合は両方を同時取得して統合
                    const [javaRes, bedrockRes] = await Promise.allSettled([
                        fetchSingleEditionEndpoint(server.address, 'java'),
                        fetchSingleEditionEndpoint(server.address, 'bedrock')
                    ]);

                    const jData = javaRes.status === 'fulfilled' ? javaRes.value : null;
                    const bData = bedrockRes.status === 'fulfilled' ? bedrockRes.value : null;

                    if (!jData && !bData) {
                        throw new Error('Java/Bedrock両方の取得に失敗しました');
                    }

                    const jOnline = Boolean(jData?.online);
                    const bOnline = Boolean(bData?.online);
                    const anyOnline = jOnline || bOnline;
                    const primary = jOnline ? jData : (bOnline ? bData : (jData || bData));

                    // JavaとBedrockのプレイヤーリストを統合（重複除外）
                    const playerMap = new Map();
                    if (jData?.playerList) {
                        jData.playerList.forEach(p => playerMap.set(p.name.toLowerCase(), { ...p, platform: 'java' }));
                    }
                    if (bData?.playerList) {
                        bData.playerList.forEach(p => {
                            const key = p.name.toLowerCase();
                            if (!playerMap.has(key)) {
                                playerMap.set(key, { ...p, platform: 'bedrock' });
                            }
                        });
                    }

                    // 同一サーバー(Geyser)の場合はJava側の合計人数を基準にしつつ、別ポート稼働で合計が異なる場合は大きい方を採用
                    const totalOnline = Math.max(jData?.playersOnline || 0, bData?.playersOnline || 0);
                    const totalMax = Math.max(jData?.playersMax || 0, bData?.playersMax || 0);

                    normalizedData = {
                        ...primary,
                        online: anyOnline,
                        isMulti: true,
                        multiDetails: {
                            java: jData,
                            bedrock: bData
                        },
                        version: [
                            jOnline ? `JE: ${jData.version}` : null,
                            bOnline ? `BE: ${bData.version}` : null
                        ].filter(Boolean).join(' / ') || primary.version,
                        playersOnline: totalOnline,
                        playersMax: totalMax,
                        playerList: Array.from(playerMap.values()),
                        pingMs: jOnline && bOnline
                            ? Math.round((jData.pingMs + bData.pingMs) / 2)
                            : primary.pingMs,
                        detectedTps: jData?.detectedTps ?? bData?.detectedTps ?? null
                    };
                } else {
                    normalizedData = await fetchSingleEditionEndpoint(server.address, server.edition);
                }

                statusCache[id] = {
                    loading: false,
                    error: null,
                    data: normalizedData,
                    fetchedAt: new Date()
                };
            } catch (err) {
                statusCache[id] = {
                    loading: false,
                    error: 'サーバーへの接続またはAPI取得に失敗しました。アドレスとポートを確認してください。',
                    data: null,
                    fetchedAt: new Date()
                };
            }

            renderServerList();
            if (selectedServerId === id) renderDetailPanel();
        }

        /**
         * mcsrvstat.us v3 のレスポンスを統一フォーマットへ変換
         */
        function normalizeMcsrvstatData(raw, server, apiLatencyMs) {
            const online = Boolean(raw.online);

            // プレイヤーリストの抽出
            let playerList = [];
            if (raw.players && Array.isArray(raw.players.list)) {
                playerList = raw.players.list.map(p => ({
                    name: typeof p === 'string' ? p : (p.name || 'Unknown'),
                    uuid: typeof p === 'object' && p.uuid ? p.uuid : null
                }));
            }

            // MOTD (HTML優先、なければclean/raw)
            let motdHtml = '';
            let motdClean = '';
            if (raw.motd) {
                if (Array.isArray(raw.motd.html)) {
                    motdHtml = raw.motd.html.join('<br>');
                } else if (Array.isArray(raw.motd.clean)) {
                    motdHtml = escapeHTML(raw.motd.clean.join('\n')).replace(/\n/g, '<br>');
                }
                if (Array.isArray(raw.motd.clean)) {
                    motdClean = raw.motd.clean.join('\n');
                }
            }

            // プラグイン / MOD一覧の抽出
            let plugins = [];
            if (Array.isArray(raw.plugins)) {
                plugins = raw.plugins.map(pl => typeof pl === 'string' ? pl : `${pl.name}${pl.version ? ' ' + pl.version : ''}`);
            }
            let mods = [];
            if (Array.isArray(raw.mods)) {
                mods = raw.mods.map(m => typeof m === 'string' ? m : `${m.name}${m.version ? ' ' + m.version : ''}`);
            }

            // サーバー情報やMOTDからTPS表記が含まれているか検出（一部サーバーはQuery/MOTDにTPSを載せている）
            const detectedTps = extractTpsFromText(motdClean + ' ' + JSON.stringify(raw.info || ''));

            return {
                online,
                hostname: raw.hostname || server.address,
                ip: raw.ip || '非公開',
                port: raw.port || (server.edition === 'bedrock' ? 19132 : 25565),
                version: raw.version || '不明',
                protocol: raw.protocol ? `${raw.protocol.name || ''} (${raw.protocol.version ?? raw.protocol})` : '不明',
                software: raw.software || null,
                icon: raw.icon || DEFAULT_ICON_SVG,
                playersOnline: raw.players ? (raw.players.online ?? 0) : 0,
                playersMax: raw.players ? (raw.players.max ?? 0) : 0,
                playerList,
                motdHtml: motdHtml || '<span class="text-slate-500">MOTDなし</span>',
                motdClean,
                map: raw.map && raw.map.clean ? raw.map.clean : (typeof raw.map === 'string' ? raw.map : null),
                gamemode: raw.gamemode || null,
                plugins,
                mods,
                detectedTps,
                pingMs: apiLatencyMs,
                debugInfo: {
                    ping: raw.debug?.ping ?? online,
                    query: raw.debug?.query ?? false,
                    srv: raw.debug?.srv ?? false,
                    cacheTime: raw.debug?.cachetime || null
                }
            };
        }

        /**
         * mcstatus.io v2 のフォールバックレスポンス変換
         */
        function normalizeMcstatusIoData(raw, server, apiLatencyMs) {
            const online = Boolean(raw.online);
            let playerList = [];
            if (raw.players && Array.isArray(raw.players.list)) {
                playerList = raw.players.list.map(p => ({
                    name: p.name_clean || p.name_raw || 'Unknown',
                    uuid: p.uuid || null
                }));
            }
            const motdHtml = raw.motd && raw.motd.html
                ? raw.motd.html
                : escapeHTML(raw.motd?.clean || 'MOTDなし').replace(/\n/g, '<br>');
            const motdClean = raw.motd?.clean || '';

            return {
                online,
                hostname: raw.host || server.address,
                ip: raw.ip_address || '非公開',
                port: raw.port || (server.edition === 'bedrock' ? 19132 : 25565),
                version: raw.version?.name_clean || raw.version?.name || '不明',
                protocol: raw.version?.protocol ? String(raw.version.protocol) : '不明',
                software: raw.software || null,
                icon: raw.icon || DEFAULT_ICON_SVG,
                playersOnline: raw.players?.online ?? 0,
                playersMax: raw.players?.max ?? 0,
                playerList,
                motdHtml,
                motdClean,
                map: null,
                gamemode: raw.gamemode || null,
                plugins: Array.isArray(raw.plugins) ? raw.plugins.map(p => p.name) : [],
                mods: Array.isArray(raw.mods) ? raw.mods.map(m => m.name) : [],
                detectedTps: extractTpsFromText(motdClean),
                pingMs: apiLatencyMs,
                debugInfo: {
                    ping: online,
                    query: false,
                    srv: Boolean(raw.srv_record),
                    cacheTime: null
                }
            };
        }

        /**
         * サーバーがMOTDやInfoに "TPS: 20.0" などを公開している場合に数値を抽出
         */
        function extractTpsFromText(text) {
            if (!text) return null;
            const match = text.match(/TPS[:\s=]*([0-9]{1,2}(?:\.[0-9]{1,2})?)/i);
            if (match && match[1]) {
                const val = parseFloat(match[1]);
                if (val >= 0 && val <= 20.5) return val;
            }
            return null;
        }

        async function refreshAllServers() {
            if (savedServers.length === 0) return;
            const icon = document.getElementById('refresh-all-icon');
            icon.classList.add('animate-spin');
            await Promise.all(savedServers.map(s => fetchServerStatus(s)));
            icon.classList.remove('animate-spin');
            showToast('全サーバーの最新ステータスを更新しました');
        }

        // ==========================================
        // サーバー追加・選択・並べ替え・削除
        // ==========================================
        function handleAddServer(event) {
            event.preventDefault();
            const addrInput = document.getElementById('add-address-input');
            const labelInput = document.getElementById('add-label-input');

            const address = addrInput.value.trim();
            if (!address) return;

            addServerInternal(address, labelInput.value.trim());

            addrInput.value = '';
            labelInput.value = '';
        }

        function quickAddPreset(address, label) {
            addServerInternal(address, label);
        }

        function addServerInternal(address, label) {
            // 既に同じアドレスが存在する場合は選択して再取得
            const existing = savedServers.find(
                s => s.address.toLowerCase() === address.toLowerCase()
            );
            if (existing) {
                selectedServerId = existing.id;
                playerSearchQuery = '';
                currentPlayerPage = 1;
                fetchServerStatus(existing);
                showToast(`「${address}」は既に登録済みのため最新情報を取得します`);
                return;
            }

            const newServer = {
                id: 'srv_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
                address,
                label
            };

            savedServers.unshift(newServer);
            selectedServerId = newServer.id;
            playerSearchQuery = '';
            currentPlayerPage = 1;

            persistServers();
            renderServerList();
            renderDetailPanel();
            fetchServerStatus(newServer);
            showToast(`「${address}」を追加しました（Java/統合版を自動判定中）`);
        }

        function quickAddPreset(address, edition, label) {
            addServerInternal(address, edition, label);
        }

        function addServerInternal(address, edition, label) {
            // 既に同じアドレス・エディションが存在する場合は選択して再取得
            const existing = savedServers.find(
                s => s.address.toLowerCase() === address.toLowerCase() && s.edition === edition
            );
            if (existing) {
                selectedServerId = existing.id;
                playerSearchQuery = '';
                currentPlayerPage = 1;
                fetchServerStatus(existing);
                showToast(`「${address}」は既に登録済みのため最新情報を取得します`);
                return;
            }

            const newServer = {
                id: 'srv_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
                address,
                edition,
                label
            };

            savedServers.unshift(newServer);
            selectedServerId = newServer.id;
            playerSearchQuery = '';
            currentPlayerPage = 1;

            persistServers();
            renderServerList();
            renderDetailPanel();
            fetchServerStatus(newServer);
            showToast(`「${address}」を追加してCookieに保存しました`);
        }

        function selectServer(id) {
            selectedServerId = id;
            playerSearchQuery = '';
            currentPlayerPage = 1;
            renderServerList();
            renderDetailPanel();

            // モバイル画面では詳細パネルへスムーズスクロール
            if (window.innerWidth < 1024) {
                document.getElementById('detail-panel-wrapper').scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        }

        function moveServer(event, id, direction) {
            event.stopPropagation();
            const idx = savedServers.findIndex(s => s.id === id);
            if (idx === -1) return;
            const targetIdx = idx + direction;
            if (targetIdx < 0 || targetIdx >= savedServers.length) return;

            const temp = savedServers[idx];
            savedServers[idx] = savedServers[targetIdx];
            savedServers[targetIdx] = temp;

            persistServers();
            renderServerList();
        }

        function promptDeleteServer(event, id) {
            event.stopPropagation();
            const srv = savedServers.find(s => s.id === id);
            if (!srv) return;
            pendingDeleteId = id;
            document.getElementById('delete-modal-target').textContent = `${srv.label ? srv.label + ' — ' : ''}${srv.address}`;
            const modal = document.getElementById('delete-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeDeleteModal() {
            pendingDeleteId = null;
            const modal = document.getElementById('delete-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        function confirmDeleteServer() {
            if (!pendingDeleteId) return;
            savedServers = savedServers.filter(s => s.id !== pendingDeleteId);
            delete statusCache[pendingDeleteId];

            if (selectedServerId === pendingDeleteId) {
                selectedServerId = savedServers.length > 0 ? savedServers[0].id : null;
            }

            persistServers();
            renderServerList();
            renderDetailPanel();
            closeDeleteModal();
            showToast('サーバーを削除しました');
        }

        // ==========================================
        // 左カラム: サーバーリスト描画
        // ==========================================
        function renderServerList() {
            const container = document.getElementById('server-count-badge');
            container.textContent = savedServers.length;

            const listEl = document.getElementById('server-list-container');
            if (savedServers.length === 0) {

                    <div class="bg-bg-surface border border-dashed border-bg-border rounded-xl p-6 text-center space-y-1">

                        <p class="text-[11px] text-muted">上の入力欄からサーバーアドレスを追加してください</p>
                    </div>

                return;
            }

            listEl.innerHTML = savedServers.map((srv, index) => {
                const state = statusCache[srv.id] || { loading: true, data: null, error: null };
                const data = state.data;
                const isSelected = srv.id === selectedServerId;

                const iconSrc = data?.icon || DEFAULT_ICON_SVG;
                const title = srv.label || srv.address;
                const detectedEd = data?.detectedEdition;
                const editionLabel = detectedEd === 'bedrock'
                    ? 'BE'
                    : (detectedEd === 'multi' ? 'JE+BE' : (detectedEd === 'java' ? 'JE' : '判定中'));

                // ステータスバッジ

                let playerCountHtml = '';
                let subInfoHtml = '';

                    statusBadge = `<span class="inline-flex items-center gap-1 text-[11px] font-semibold px-2 py-0.5 rounded bg-sky-500/15 text-sky-500"><i class="fa-solid fa-spinner animate-spin"></i> 取得中</span>`;
                    playerCountHtml = `<span class="text-xs font-mono text-muted">-- / --</span>`;
                    subInfoHtml = `<span class="text-[11px] text-muted">接続中...</span>`;
                } else if (data && data.online) {
                    statusBadge = `<span class="inline-flex items-center gap-1.5 text-[11px] font-semibold px-2 py-0.5 rounded bg-mc-emerald/15 text-mc-emerald"><span class="w-1.5 h-1.5 rounded-full bg-mc-emerald"></span>ONLINE</span>`;
                    playerCountHtml = `
                        <div class="text-right">
                            <span class="text-sm font-bold font-mono text-main">${data.playersOnline.toLocaleString()}</span>
                            <span class="text-xs font-mono text-muted">/${data.playersMax.toLocaleString()}</span>
                        </div>
                    `;
                    subInfoHtml = `
                        <span class="truncate text-[11px] font-mono text-muted">${escapeHTML(data.version)}</span>
                        <span class="text-[11px] font-mono text-mc-emerald shrink-0">${data.pingMs}ms</span>
                    `;
                } else {
                    statusBadge = `<span class="inline-flex items-center gap-1.5 text-[11px] font-semibold px-2 py-0.5 rounded bg-red-500/15 text-red-500"><span class="w-1.5 h-1.5 rounded-full bg-red-500"></span>OFFLINE</span>`;
                    playerCountHtml = `<span class="text-xs font-mono text-muted">0 / 0</span>`;
                    subInfoHtml = `<span class="text-[11px] text-red-500 truncate">${state.error ? '接続エラー' : 'オフライン'}</span>`;
                }

                const activeBorder = isSelected
                    ? 'border-mc-emerald bg-bg-surface ring-1 ring-mc-emerald/40'
                    : 'border-bg-border bg-bg-surface hover:bg-bg-elevated/60';

                return `
                    <div onclick="selectServer('${srv.id}')" class="rounded-xl border p-3 transition cursor-pointer select-none ${activeBorder}">
                        <div class="flex items-center gap-3">
                            <!-- サーバーアイコン -->
                            <img src="${iconSrc}" onerror="this.src='${DEFAULT_ICON_SVG}'" alt="icon"
                                class="w-11 h-11 rounded-lg bg-bg-base border border-bg-border pixelated object-cover shrink-0">

                            <!-- 中央情報 -->
                            <div class="min-w-0 flex-1 space-y-0.5">
                                <div class="flex items-center justify-between gap-2">
                                    <div class="flex items-center gap-1.5 min-w-0">
                                        <span class="text-[10px] font-mono font-bold px-1.5 py-0.2 rounded bg-bg-elevated text-main border border-bg-border shrink-0">${editionLabel}</span>
                                        <h4 class="font-bold text-sm text-main truncate">${escapeHTML(title)}</h4>
                                    </div>
                                    ${statusBadge}
                                </div>

                                <div class="flex items-center justify-between gap-2">
                                    <code class="text-xs font-mono text-muted truncate">${escapeHTML(srv.address)}</code>
                                    ${playerCountHtml}
                                </div>

                                <div class="flex items-center justify-between gap-2">
                                    ${subInfoHtml}
                                </div>
                            </div>

                            <!-- 並べ替え・削除アクション -->

        /**
         * プレイヤー顔画像URL生成（Minotar公式APIをプライマリにし、CORS制限を受けないimgタグで高速取得）
         */
        function getPlayerAvatarPrimaryUrl(player) {
            const cleanName = encodeURIComponent(player.name.replace(/^\./, ''));
            return `https://minotar.net/helm/${cleanName}/32.png`;
        }

        /**
         * img読み込みエラー時の多段フォールバックハンドラ（Minotar -> mc-heads -> crafatar -> デフォルトSteve）
         */
        function handleAvatarError(imgEl) {
            const step = Number(imgEl.dataset.fallbackStep || 0);
            const rawName = imgEl.dataset.username || '';
            const cleanName = encodeURIComponent(rawName.replace(/^\./, ''));
            const uuid = (imgEl.dataset.uuid || '').replace(/-/g, '');

            if (step === 0 && uuid) {
                imgEl.dataset.fallbackStep = '1';
                imgEl.src = `https://crafatar.com/avatars/${uuid}?size=32&overlay=true`;
            } else if (step <= 1 && cleanName) {
                imgEl.dataset.fallbackStep = '2';
                imgEl.src = `https://mc-heads.net/avatar/${uuid || cleanName}/32`;
            } else {
                imgEl.onerror = null;
                imgEl.src = DEFAULT_STEVE_HEAD_SVG;
            }
        }

        /**
         * オンラインプレイヤー一覧グリッド＋1ページ50人のページネーションHTMLを生成
         */

            if (data.playersOnline === 0) {
                return `
                    <div class="bg-bg-base border border-bg-border rounded-lg p-5 text-center text-xs text-muted">
                        現在オンラインのプレイヤーはいません。
                    </div>
                `;
            }

            if (data.playerList.length === 0) {
                return `
                    <div class="bg-bg-base border border-bg-border rounded-lg p-3.5 text-xs space-y-1">
                        <p class="font-semibold text-main">現在 ${data.playersOnline.toLocaleString()} 人がオンラインです（プレイヤー名はサーバー側で非公開）</p>
                        <p class="text-muted">サーバー側の設定により、個別プレイヤー名のリストは公開されていません。</p>
                    </div>
                `;
            }

            const filtered = data.playerList.filter(p =>
                p.name.toLowerCase().includes(playerSearchQuery.toLowerCase())
            );

            if (filtered.length === 0) {
                return `
                    <div class="bg-bg-base border border-bg-border rounded-lg p-5 text-center text-xs text-muted">
                        「${escapeHTML(playerSearchQuery)}」に一致するプレイヤーは見つかりませんでした。
                    </div>
                `;
            }

            const totalItems = filtered.length;
            const totalPages = Math.max(1, Math.ceil(totalItems / PLAYERS_PER_PAGE));
            if (currentPlayerPage > totalPages) currentPlayerPage = totalPages;
            if (currentPlayerPage < 1) currentPlayerPage = 1;

            const startIdx = (currentPlayerPage - 1) * PLAYERS_PER_PAGE;
            const endIdx = Math.min(startIdx + PLAYERS_PER_PAGE, totalItems);
            const pagePlayers = filtered.slice(startIdx, endIdx);

            const remainingServerHidden = data.playersOnline - data.playerList.length;

            // ページ番号ボタンの生成
            let paginationHtml = '';
            if (totalPages > 1) {
                const pageButtons = getPaginationRange(currentPlayerPage, totalPages).map(item => {
                    if (item === '...') {
                        return `<span class="px-1.5 py-1 text-xs text-muted">...</span>`;
                    }
                    const isCurrent = item === currentPlayerPage;
                    return `
                        <button type="button" onclick="changePlayerPage(${item})"
                            class="min-w-[30px] h-7 px-2 rounded text-xs font-mono font-bold transition cursor-pointer ${
                                isCurrent
                                    ? 'bg-mc-emerald text-white'
                                    : 'bg-bg-base hover:bg-bg-elevated text-main border border-bg-border'
                            }">
                            ${item}
                        </button>
                    `;
                }).join('');

                paginationHtml = `
                    <div class="flex flex-wrap items-center justify-between gap-2 pt-2.5 border-t border-bg-border">
                        <div class="text-[11px] font-mono text-muted">
                            ${(startIdx + 1).toLocaleString()} - ${endIdx.toLocaleString()} / ${totalItems.toLocaleString()}人
                        </div>
                        <div class="flex items-center gap-1">
                            <button type="button" onclick="changePlayerPage(${currentPlayerPage - 1})" ${currentPlayerPage === 1 ? 'disabled' : ''}
                                class="px-2 h-7 rounded text-xs font-semibold bg-bg-base hover:bg-bg-elevated text-main border border-bg-border disabled:opacity-30 disabled:pointer-events-none cursor-pointer">
                                前へ
                            </button>
                            ${pageButtons}
                            <button type="button" onclick="changePlayerPage(${currentPlayerPage + 1})" ${currentPlayerPage === totalPages ? 'disabled' : ''}
                                class="px-2 h-7 rounded text-xs font-semibold bg-bg-base hover:bg-bg-elevated text-main border border-bg-border disabled:opacity-30 disabled:pointer-events-none cursor-pointer">
                                次へ
                            </button>
                        </div>
                    </div>
                `;
            } else {
                paginationHtml = `
                    <div class="text-[11px] font-mono text-muted pt-1">
                        全 ${totalItems.toLocaleString()}人表示中（1ページ最大50人）
                    </div>
                `;
            }

            return `
                <div class="space-y-2.5">
                    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-1.5">
                        ${pagePlayers.map(player => {
                            const safeName = escapeHTML(player.name);
                            const safeUuid = escapeAttr(player.uuid || '');
                            const safeNameAttr = escapeAttr(player.name);
                            const isBedrockUser = player.platform === 'bedrock' || player.name.startsWith('.');
                            const avatarUrl = getPlayerAvatarPrimaryUrl(player);
                            return `
                                <div onclick="copyText('${safeNameAttr}')" title="クリックでMCIDをコピー"
                                    class="flex items-center gap-2 p-1.5 rounded-lg bg-bg-base hover:bg-bg-elevated border border-bg-border hover:border-mc-emerald/60 transition cursor-pointer">
                                    <img src="${avatarUrl}"
                                        data-username="${safeNameAttr}"
                                        data-uuid="${safeUuid}"
                                        data-fallback-step="0"
                                        onerror="handleAvatarError(this)"
                                        loading="lazy"
                                        alt="${safeName}"
                                        class="w-6 h-6 rounded bg-bg-elevated pixelated shrink-0">
                                    <div class="min-w-0 flex-1 flex items-center justify-between gap-1">
                                        <span class="text-xs font-mono font-medium text-main truncate">
                                            ${safeName}
                                        </span>
                                        ${isBedrockUser ? `<span class="text-[9px] font-mono px-1 rounded bg-sky-500/15 text-sky-500 shrink-0">BE</span>` : ''}
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>

                    ${paginationHtml}

                    ${remainingServerHidden > 0 ? `
                        <p class="text-[11px] text-muted bg-bg-base border border-bg-border rounded-lg px-3 py-2">
                            ※ サーバー側の応答制限により、取得できた ${data.playerList.length} 名のみ表示しています（残り ${remainingServerHidden.toLocaleString()} 名はサーバーから未送信）。
                        </p>
                    ` : ''}
                </div>
            `;
        }

        function getPaginationRange(current, total) {
            if (total <= 7) {
                return Array.from({ length: total }, (_, i) => i + 1);
            }
            if (current <= 4) {
                return [1, 2, 3, 4, 5, '...', total];
            }
            if (current >= total - 3) {
                return [1, '...', total - 4, total - 3, total - 2, total - 1, total];
            }
            return [1, '...', current - 1, current, current + 1, '...', total];
        }

        /**
         * 検索入力時：input要素を再描画せず、プレイヤーリスト部分だけを更新する（フォーカス維持）
         */
        function handlePlayerSearch(val) {
            playerSearchQuery = val;
            currentPlayerPage = 1;

            const clearBtn = document.getElementById('player-search-clear');
            if (clearBtn) {
                clearBtn.classList.toggle('hidden', !val);
            }

            updatePlayersAreaOnly();
        }

        function clearPlayerSearch() {
            const input = document.getElementById('player-search-input');
            if (input) {
                input.value = '';
                input.focus();
            }
            handlePlayerSearch('');
        }

        function changePlayerPage(page) {
            currentPlayerPage = page;
            updatePlayersAreaOnly();
            const area = document.getElementById('players-list-area');
            if (area) {
                area.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
        }

        function updatePlayersAreaOnly() {
            const srv = savedServers.find(s => s.id === selectedServerId);
            if (!srv) return;
            const state = statusCache[srv.id];
            if (!state || !state.data) return;

            const area = document.getElementById('players-list-area');
            if (area) {
                area.innerHTML = buildPlayersAreaHTML(state.data);
            }
        }

        function toggleAutoRefresh() {
            autoRefreshEnabled = !autoRefreshEnabled;
            if (autoRefreshTimer) {
                clearInterval(autoRefreshTimer);
                autoRefreshTimer = null;
            }
            if (autoRefreshEnabled) {
                autoRefreshTimer = setInterval(() => {
                    const srv = savedServers.find(s => s.id === selectedServerId);
                    if (srv) fetchServerStatus(srv, true);
                }, 15000);
                showToast('15秒ごとの自動更新を有効にしました');
            } else {
                showToast('自動更新をオフにしました');
            }
            renderDetailPanel();
        }

        // ==========================================
        // ユーティリティ関数
        // ==========================================
        function escapeHTML(str) {
            return String(str ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function escapeAttr(str) {
            return String(str ?? '').replace(/'/g, "\\'").replace(/"/g, '&quot;');
        }

        function copyText(text) {
            if (!text) return;
            const input = document.createElement('input');
            input.value = text;
            document.body.appendChild(input);
            input.select();
            document.execCommand('copy');
            document.body.removeChild(input);
            showToast(`「${text}」をコピーしました`);
        }

        function showToast(message) {
            const container = document.getElementById('toast-container');
            const el = document.createElement('div');
            el.className = 'toast-anim pointer-events-auto flex items-center gap-2 px-3.5 py-2 rounded-lg bg-bg-surface border border-mc-emerald/60 text-main text-xs font-semibold shadow-lg';
            el.innerHTML = `<i class="fa-solid fa-check text-mc-emerald"></i><span>${escapeHTML(message)}</span>`;
            container.appendChild(el);

            setTimeout(() => {
                el.style.opacity = '0';
                el.style.transition = 'opacity 0.2s ease';
                setTimeout(() => el.remove(), 220);
            }, 2500);
        }

        // ==========================================
        // 起動時初期化
        // ==========================================
        window.addEventListener('DOMContentLoaded', () => {
            initTheme();
            restoreServers();
            renderServerList();
            renderDetailPanel();

            // 保存されている全サーバーのリアルタイムステータスを取得
            savedServers.forEach(srv => fetchServerStatus(srv));
        });
    </script>
</body>
</html>
